<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FII Study 2 — Prepware</title>
<link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="theme/flightbag-theme.css">
<style>
:root{--bg:var(--fb-bg);--panel:var(--fb-panel);--panel2:var(--fb-cell);--line:var(--fb-border);--hair:var(--fb-line);
--text:var(--fb-text);--muted:var(--fb-dim);--bright:var(--fb-bright);--accent:var(--fb-accent);--accentsoft:color-mix(in srgb,var(--fb-accent) 50%,transparent);
--good:var(--fb-ok);--goodbg:color-mix(in srgb,var(--fb-ok) 13%,transparent);--goodline:color-mix(in srgb,var(--fb-ok) 45%,transparent);--goodsoft:color-mix(in srgb,var(--fb-ok) 50%,transparent);
--bad:var(--fb-bad);--badbg:color-mix(in srgb,var(--fb-bad) 13%,transparent);--warn:var(--fb-warn);--chip:color-mix(in srgb,var(--fb-cell) 82%,transparent);--star:var(--fb-warn);
--hi:rgba(255,255,255,.03);--hi2:rgba(255,255,255,.06);}
/* light variant (sidebar "Toggle theme"): re-point the Flight Bag tokens, everything else follows */
html[data-theme="light"]{color-scheme:light;--fb-bg:#efeee9;--fb-panel:#fbfaf7;--fb-cell:#e9e7e1;--fb-border:#d4d1c8;--fb-rim:#d4d1c8;
--fb-line:rgba(40,36,30,.1);--fb-text:#3a3833;--fb-dim:#6e6c64;--fb-bright:#1c1b19;--fb-accent:#c2603f;
--fb-ok:#4d7a39;--fb-bad:#b0453a;--fb-warn:#94701c;--hi:rgba(40,36,30,.035);--hi2:rgba(40,36,30,.06);}
*{box-sizing:border-box}
body.fb{margin:0;background:var(--bg);color:var(--text);
font:15px/1.55 var(--fb-font);
-webkit-font-smoothing:antialiased;position:relative}
.wrap{position:relative;z-index:1;display:flex;align-items:flex-start;min-height:100vh}
.sidebar{width:300px;flex:0 0 300px;border:0;border-radius:0;box-shadow:none;border-right:1px solid var(--fb-rim);height:100vh;position:sticky;top:0;
overflow-y:auto;padding:18px 14px}
.wrap.collapsed .sidebar,.wrap.testing .sidebar{display:none}
.appcol{flex:1;min-width:0}
.mainpane{max-width:840px;margin:0 auto;padding:26px 22px}
.mainpane.center{padding-top:9vh}
.sbrand{display:flex;align-items:center;justify-content:space-between}
.btitle{font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:2.5px;color:var(--bright);display:flex;align-items:center;gap:9px;margin-right:auto}
.iconbtn{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:var(--fb-radius-sm);
padding:5px 9px;font-size:14px;cursor:pointer;line-height:1;transition:border-color .12s,color .12s}
.iconbtn:hover{border-color:var(--accent);color:var(--accent)}
.bsub{color:var(--muted);font-size:12px;margin:4px 0 14px;letter-spacing:.02em}
.sidebar #search{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);
border-radius:var(--fb-radius-sm);padding:9px 11px;font-size:13.5px;outline:none;margin-bottom:12px;transition:border-color .12s}
.sidebar #search:focus{border-color:var(--accent)}
.tabbar{display:flex;gap:2px;background:var(--panel2);border:1px solid var(--hair);border-radius:var(--fb-radius-sm);padding:2px;margin:2px 0 12px}
.tabbar button{flex:1;background:none;border:0;color:var(--muted);padding:6px 4px;min-height:34px;border-radius:4px;font:inherit;font-size:12px;
letter-spacing:.03em;cursor:pointer;transition:color .12s,background .12s}
.tabbar button:hover{color:var(--bright)}
.tabbar button.active{background:var(--panel);color:var(--accent);box-shadow:0 1px 0 color-mix(in srgb,var(--accent) 60%,transparent)}
.sbox{background:var(--panel2);border:1px solid var(--hair);border-radius:var(--fb-radius-sm);padding:13px;margin-bottom:8px}
.sbox h3{margin:0 0 9px;font-size:10px;text-transform:uppercase;letter-spacing:2.5px;color:var(--muted)}
.srow{display:flex;justify-content:space-between;font-size:13px;margin:5px 0;gap:8px}.srow b{font-variant-numeric:tabular-nums}
.mbar{height:4px;background:var(--bg);border-radius:2px;overflow:hidden;margin:3px 0 2px}.mbar>i{display:block;height:100%}
.catname{font-size:13px;margin-top:9px;display:flex;justify-content:space-between}.catname span:last-child{color:var(--muted);font-size:11.5px}
.bars2{display:flex;gap:6px}.bars2 .mbar{flex:1}
.weak{background:linear-gradient(90deg,var(--badbg),transparent);border-left:2px solid var(--bad);border-radius:var(--fb-radius-sm);padding:8px 10px;font-size:12.5px}
.stagebox .sname{font-weight:650;font-size:14px}.stagebox .sph{font-size:12px;color:var(--accent);margin:2px 0}
.stagebox .sdesc{font-size:12.5px;color:var(--muted);margin:4px 0 10px}
.stagebtns{display:flex;gap:6px}.stagebtns .btn{flex:1;text-align:center;padding:7px}
.btn{background:var(--chip);border:1px solid var(--line);color:var(--text);border-radius:var(--fb-radius-sm);padding:8px 12px;
font-size:13px;cursor:pointer;white-space:nowrap;transition:border-color .12s,background .12s}
.btn:hover{border-color:var(--accent)}.btn.active{background:var(--accent);border-color:var(--accent);color:var(--fb-on-accent)}
.btn:disabled{cursor:default}
.linkbtn{background:none;border:0;color:var(--accent);cursor:pointer;font-size:12px;padding:0}
.sgroup{margin:0 0 14px}.slabel{font-size:10px;text-transform:uppercase;letter-spacing:2.5px;color:var(--muted);margin-bottom:6px}
.sidebar .seg{display:flex;gap:2px;width:100%;padding:2px;background:var(--panel2);border:1px solid var(--hair);border-radius:var(--fb-radius-sm)}
.sidebar .seg button{flex:1;background:none;border:0;border-radius:4px;color:var(--muted);padding:6px 4px;min-height:34px;font:inherit;font-size:12px;cursor:pointer;transition:background .12s,color .12s}
.sidebar .seg button:hover{color:var(--bright)}
.sidebar .seg button.active{background:var(--panel);color:var(--accent);box-shadow:0 1px 0 color-mix(in srgb,var(--accent) 60%,transparent)}
.sbtn{display:block;width:100%;text-align:left;background:var(--chip);border:1px solid var(--line);color:var(--text);
border-radius:var(--fb-radius-sm);padding:9px 11px;font-size:13px;cursor:pointer;margin:6px 0;transition:border-color .12s}
.sbtn:hover{border-color:var(--accent)}.sbtn.active{background:color-mix(in srgb,var(--accent) 10%,var(--panel2));border-color:var(--accent);color:var(--accent)}
.sgroup input[type=range]{width:100%;accent-color:var(--accent)}
.catopt{display:flex;justify-content:space-between;width:100%;background:var(--chip);border:1px solid var(--line);
color:var(--text);border-radius:var(--fb-radius-sm);padding:10px 12px;font-size:13.5px;cursor:pointer;margin:6px 0;transition:border-color .12s}
.catopt span{color:var(--muted);font-size:12px}.catopt:hover{border-color:var(--accent)}
.catopt.active{background:color-mix(in srgb,var(--accent) 10%,var(--panel2));border-color:var(--accent);color:var(--accent)}
.catrow{display:flex;gap:6px;align-items:stretch;margin:6px 0}
.catrow .catopt{flex:1;margin:0;min-width:0}
.catrow .catopt{display:flex;justify-content:space-between;gap:8px;align-items:center}
.catrow .catopt>b{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.catrow .catopt>span{flex:0 0 auto;white-space:nowrap}
.catjump{flex:0 0 40px;background:var(--chip);border:1px solid var(--line);color:var(--muted);
  border-radius:var(--fb-radius-sm);font-size:15px;cursor:pointer;line-height:1;transition:border-color .12s,color .12s}
.catjump:hover{border-color:var(--accent);color:var(--accent);background:var(--hi)}
.catopt.cur{border-color:var(--accent)}
.curdot{color:var(--accent);font-size:10.5px;font-weight:700;margin-left:6px}
.notecol{width:320px;flex:0 0 320px;border:0;border-radius:0;box-shadow:none;border-left:1px solid var(--fb-rim);height:100vh;position:sticky;top:0;
  padding:14px 12px;display:none;flex-direction:column;gap:8px}
body.notes .notecol{display:flex}
.nhead{display:flex;align-items:center;justify-content:space-between;gap:6px}
.nhead .ntitle{font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:2.5px;color:var(--bright);display:flex;align-items:center;gap:9px}
.notecol textarea{flex:1;min-height:200px;width:100%;background:var(--panel2);border:1px solid var(--line);
  color:var(--text);border-radius:var(--fb-radius-sm);padding:11px;resize:none;outline:none;
  font:13.5px/1.6 var(--fb-font)}
.notecol textarea:focus{border-color:var(--accent)}
.nrow{display:flex;gap:6px}
.nrow .btn{flex:1;text-align:center;font-size:12px;padding:7px 6px}
.nfoot{font-size:11px;color:var(--muted)}
.npaused{background:linear-gradient(90deg,color-mix(in srgb,var(--warn) 16%,transparent),transparent);border-left:2px solid var(--warn);color:var(--warn);
  border-radius:var(--fb-radius-sm);padding:7px 10px;font-size:12px;font-weight:600;display:none}
body.notepaused .npaused{display:block}
.notetoggle.on{border-color:var(--accent);color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
@media(max-width:900px){
  .notecol{width:100%;flex:none;height:auto;position:static;border-left:0;border-top:1px solid var(--hair);order:3;background-color:var(--panel)}
  .notecol textarea{min-height:220px}
}
.uchips{display:flex;gap:4px;flex-wrap:wrap;margin:5px 0 2px}
.uchip{width:26px;height:26px;border-radius:var(--fb-radius-sm);border:1px solid var(--line);background:var(--chip);
  color:var(--muted);font-size:11.5px;font-weight:700;cursor:pointer;padding:0;line-height:1;transition:border-color .12s,color .12s}
.uchip:hover{border-color:var(--accent);color:var(--accent)}
.uchip.part{background:color-mix(in srgb,var(--accent) 20%,transparent);color:var(--text);border-color:var(--accentsoft)}
.uchip.full{background:var(--goodbg);color:var(--text);border-color:var(--goodline)}
.uchip.done{background:var(--good);border-color:var(--good);color:var(--fb-on-accent)}
.uchip.cur{box-shadow:inset 0 0 0 1px var(--accent);border-color:var(--accent);color:var(--text)}
.nextbox{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 14%,var(--panel2)),var(--panel2));
  border:1px solid var(--hair);border-left:2px solid var(--accent)}
.nextbox .nt{font-size:14px;font-weight:700;margin-bottom:2px}
.nextbox .ns{font-size:12px;color:var(--muted);margin-bottom:9px}
.nextbox .btn{width:100%;text-align:center}
.ulegend{font-size:10.5px;color:var(--muted);margin-top:7px;display:flex;gap:9px;flex-wrap:wrap}
.ulegend i{font-style:normal;display:inline-flex;align-items:center;gap:4px}
.ubox{width:10px;height:10px;border-radius:2px;display:inline-block;border:1px solid var(--line)}
.catdone{color:var(--good);font-size:11px;margin-left:6px}.catopt.active span{color:var(--muted)}
.floatbtn{position:fixed;top:14px;left:14px;z-index:30;display:none;background:var(--panel);border:1px solid var(--line);
color:var(--text);border-radius:var(--fb-radius-sm);padding:8px 12px;cursor:pointer;font-size:15px}
.wrap.collapsed .floatbtn{display:block}.wrap.testing .floatbtn{display:none}
.qtools{position:fixed;top:14px;left:312px;z-index:16;display:flex;flex-direction:column;gap:8px}
.wrap.collapsed .qtools{left:62px}.wrap.testing .qtools{display:none}
.qmark{width:38px;height:38px;border-radius:8px;background:var(--panel);border:1px solid var(--line);color:var(--text);
font-family:var(--fb-font);font-size:19px;font-weight:700;cursor:pointer;display:flex;
align-items:center;justify-content:center;line-height:1;box-shadow:0 2px 12px rgba(0,0,0,.35);transition:border-color .12s}
html[data-theme="light"] .qmark{box-shadow:0 2px 10px rgba(20,24,32,.12)}
.qmark:hover{border-color:var(--accent);color:var(--bright)}.qmark.on{border-color:var(--accent);color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.testx{position:fixed;top:14px;left:14px;z-index:40;display:none;align-items:center;justify-content:center;
width:38px;height:38px;border-radius:8px;background:var(--panel);border:1px solid var(--line);color:var(--text);
font-family:var(--fb-font);font-size:19px;cursor:pointer;box-shadow:0 2px 12px rgba(0,0,0,.35);transition:border-color .12s}
html[data-theme="light"] .testx{box-shadow:0 2px 10px rgba(20,24,32,.12)}
.testpause{top:62px}.wrap.testing .testpause{display:flex}
.testprev{top:110px}.wrap.testing .testprev{display:flex}
/* keep the notes toggle reachable during a test (the rest of qtools stays hidden inline) */
.wrap.testing .qtools{display:flex;left:14px;top:158px;flex-direction:column}
@media(max-width:900px){.wrap.testing .qtools{left:auto;right:12px;top:auto;bottom:14px;flex-direction:row}}
.testprev:hover{border-color:var(--accent);color:var(--accent)}
.yourpick{margin-left:auto;font-size:10px;font-weight:700;letter-spacing:.05em;color:var(--muted);
  border:1px solid var(--line);border-radius:var(--fb-radius-sm);padding:1px 8px;white-space:nowrap}
.tchoice.pick-wrong .yourpick{color:var(--bad);border-color:var(--bad)}
.revexp{background:var(--panel2);border-left:2px solid var(--accent);border-radius:var(--fb-radius-sm);
  padding:11px 13px;margin-top:12px;font-size:13px;line-height:1.6;color:var(--muted)}
.revexp b{color:var(--text)}
.testpause:hover{border-color:var(--accent);color:var(--accent)}
.testx:hover{border-color:var(--bad);color:var(--bad)}.wrap.testing .testx{display:flex}
.wrap:not(.testing) .testx{display:none!important}
.plan{border-radius:var(--fb-radius);margin:0 0 16px;overflow:hidden;display:none}
.plan.open{display:block}.plan .phdr{padding:14px 18px;border-bottom:1px solid var(--hair)}
.plan h2{margin:0 0 4px;font-size:16px}.plan .goal{color:var(--muted);font-size:13px}
.bar{height:6px;background:var(--panel2);border-radius:3px;margin-top:10px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--good);width:0}
.pbody{padding:8px 18px 16px}.phase{margin-top:12px}.phase .pt{font-weight:650;font-size:13.5px;color:var(--accent);margin:6px 0}
.step{display:flex;align-items:flex-start;gap:10px;padding:8px 10px;background:var(--hi);border-left:2px solid var(--line);border-radius:var(--fb-radius-sm);margin:6px 0}
.step input{margin-top:3px;width:16px;height:16px;accent-color:var(--good);cursor:pointer}
.step .lbl{flex:1;font-size:14px}.step .lbl small{color:var(--muted);display:block;font-size:12px}
.step.done .lbl{opacity:.55;text-decoration:line-through}
.start{background:var(--chip);border:1px solid var(--line);color:var(--text);border-radius:var(--fb-radius-sm);padding:5px 10px;font-size:12px;cursor:pointer;white-space:nowrap}
.start:hover{border-color:var(--accent);color:var(--accent)}
.ssearch{position:sticky;top:0;z-index:30;display:none;align-items:center;gap:10px;margin:-26px -22px 14px;padding:14px 22px 12px;background:var(--bg);border-bottom:1px solid var(--line)}
.ssearch svg{width:18px;height:18px;flex:none;fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round}
.ssearch input{flex:1;min-width:0;font:inherit;font-size:16px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text)}
.ssearch input:focus{outline:none;border-color:var(--accent)}
.ssearch .scount{flex:none;font-size:13px;color:var(--muted);white-space:nowrap}
body.scrollmode .ssearch{display:flex}
.catbar{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:16px}
.cbchip{background:var(--chip);border:1px solid var(--line);color:var(--muted);border-radius:var(--fb-radius-sm);padding:6px 13px;
font-size:12px;letter-spacing:.02em;cursor:pointer;transition:border-color .12s,color .12s}
.cbchip:hover{border-color:var(--accent);color:var(--text)}.cbchip.active{background:color-mix(in srgb,var(--accent) 10%,var(--panel2));border-color:var(--accent);color:var(--accent)}
.chead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:0 0 4px;justify-content:center}
.chead .ttl{font-size:16px;font-weight:650}.chead .n{color:var(--muted);font-weight:500;font-size:13px}
.studysub{text-align:center;color:var(--muted);font-size:13px;margin:0 0 16px}
.studyfoot{display:flex;justify-content:center;align-items:center;gap:14px;margin:18px 0}.studyfoot .rev{color:var(--muted);font-size:13px}
.navbar{display:flex;align-items:center;gap:10px;justify-content:center;margin:4px 0 14px}
.pos{font-size:13px;color:var(--muted);min-width:80px;text-align:center;font-variant-numeric:tabular-nums}
.card{position:relative;overflow:hidden;border-radius:var(--fb-radius);
padding:22px 24px;margin:8px 0}
.timebar{position:absolute;top:0;left:0;height:3px;width:100%;background:var(--accent);z-index:2}
.timebar.warn{background:var(--warn)}.timebar.crit{background:var(--bad)}
.qmeta{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:2px}
.qleft{display:flex;align-items:center;gap:8px}
.qid{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.qtag{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--chip);border:0;border-radius:var(--fb-radius-sm);padding:3px 8px}
.qactions{display:flex;align-items:center;gap:6px}
.flag{background:none;border:none;cursor:pointer;font-size:17px;line-height:1;color:var(--muted);padding:2px}.flag.on{color:var(--star)}
.stem{font-weight:600;margin:6px 0 16px;font-size:16px;line-height:1.55}
.choice{display:flex;gap:10px;padding:11px 13px;border:0;border-left:2px solid transparent;border-radius:var(--fb-radius-sm);margin:8px 0;
background:linear-gradient(90deg,var(--hi2),var(--hi))}
.choice .lt{font-weight:700;color:var(--muted);min-width:18px}
.choice.correct{background:linear-gradient(90deg,var(--goodbg),transparent);border-left-color:var(--good)}
.choice.correct .lt{color:var(--good)}.choice.correct::after{content:"✓";margin-left:auto;color:var(--good);font-weight:800}
.expcard{border-left:2px solid var(--accent);margin-top:-4px}
.expcard .eh{font-size:10px;text-transform:uppercase;letter-spacing:2.5px;color:var(--muted);margin-bottom:8px}
.expcard .etext{font-size:14px;line-height:1.6}
.empty{color:var(--muted);text-align:center;padding:40px}
mark{background:var(--warn);color:var(--fb-bg);border-radius:3px}
.tsetup{border-radius:var(--fb-radius);padding:24px;text-align:center}
.tsetup h2{margin:0 0 8px}.tsetup p{color:var(--muted);margin:6px 0}
.testopts{display:flex;flex-direction:column;gap:8px;margin:14px auto;max-width:420px;text-align:left}
.topt{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:var(--fb-radius-sm);padding:12px 14px;
font-size:14px;cursor:pointer;display:flex;justify-content:space-between;transition:border-color .12s}
.topt:hover{border-color:var(--accent)}.topt.active{background:color-mix(in srgb,var(--accent) 10%,var(--panel2));border-color:var(--accent);color:var(--accent)}
.topt span{color:var(--muted)}.topt.active span{color:var(--muted)}
.tbar{display:flex;justify-content:space-between;align-items:center;font-size:13px;gap:12px;flex-wrap:wrap;margin-bottom:6px;color:var(--muted)}
.tchoice{display:flex;gap:10px;padding:13px 14px;border:0;border-left:2px solid transparent;border-radius:var(--fb-radius-sm);margin:8px 0;
background:linear-gradient(90deg,var(--hi2),var(--hi));cursor:pointer;transition:background .12s,border-color .12s}
.tchoice:hover{border-left-color:var(--accent);background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 10%,transparent),var(--hi))}
.tchoice .lt{font-weight:700;color:var(--muted);min-width:18px}
.tchoice.pick-correct{background:linear-gradient(90deg,var(--goodbg),transparent);border-left-color:var(--good);animation:pop .45s}
.tchoice.pick-wrong{background:linear-gradient(90deg,var(--badbg),transparent);border-left-color:var(--bad);animation:shake .5s}
.tchoice.show-correct{background:linear-gradient(90deg,var(--goodbg),transparent);border-left-color:var(--good)}
.tchoice.disabled{pointer-events:none}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-9px)}40%,60%{transform:translateX(9px)}}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.035)}100%{transform:scale(1)}}
.tdone{text-align:center;padding:30px}.tdone .big{font-size:44px;font-weight:750;margin:6px 0;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.rbadge{font-size:10px;font-weight:700;letter-spacing:.04em;padding:2px 7px;border-radius:var(--fb-radius-sm);margin-left:2px;white-space:nowrap}

<script type="text/plain" id="appsrc">
const ALL=JSON.parse(document.getElementById('data').textContent);
const FIGS=JSON.parse(document.getElementById('figs').textContent);
const content=document.getElementById('content');
let course=null,D=null,PFX='ft5_',QID={};
const FIGCAT='★ Figure questions';
const MISSCAT='✗ Missed bank';
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let activeCat='All',seq='a',answers='allhi',expOn=false,mode='study',shuffleOn=false,markedOnly=false;
let clickIdx=0,clockOn=false,speedSecs=20,activeTab='categories',testSel='random100',testLen=100;
let marks=new Set(),planDone=new Set(),missedEver=new Set();
let reviewed=new Set(),qtest={},qlast={},currentStage=0;
let expOpen=new Set(),query='';
const wrap=document.getElementById('wrap');

/* ---------- TTS (read aloud) ---------- */
let ttsOn=store.get('ft5_tts',true),ttsRate=store.get('ft5_ttsrate',1.0);
let ttsAudio=null,ttsEl=null,ttsNeuralDead=false,ttsToken=null,ttsLastKey=null,curStudyQ=null,ttsUserAct=false;
function ttsElement(){if(!ttsEl){ttsEl=new Audio();ttsEl.preload='auto';}return ttsEl;}
function ttsUnlock(){ttsUserAct=true;try{const el=ttsElement();if(el._unlocked)return;
  el.muted=true;el.src='data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YQAAAAA=';
  el.play().then(()=>{el._unlocked=true;el.pause();el.muted=false;}).catch(()=>{el.muted=false;});}catch(e){}}
document.addEventListener('click',ttsUnlock,true);
function ttsStop(){ttsToken={};if(ttsAudio){try{ttsAudio.pause();}catch(e){}ttsAudio=null;}
  try{speechSynthesis.cancel();}catch(e){}}
function ttsNeededRate(baseSecs,targetSecs){let r=ttsRate;
  if(targetSecs&&baseSecs/r>targetSecs)r=baseSecs/Math.max(2,targetSecs-0.5);
  return Math.min(3,Math.max(0.5,r));}
let ttsVoice=null;
try{speechSynthesis.onvoiceschanged=()=>{ttsVoice=null;};speechSynthesis.getVoices();}catch(e){}
function ttsPickVoice(){if(ttsVoice)return ttsVoice;const vs=speechSynthesis.getVoices();if(!vs||!vs.length)return null;
  const notGB=x=>!/GB|_GB|-GB/i.test((x.lang||'')+' '+(x.name||''));
  const pref=[/Microsoft.*(Aria|Jenny|Michelle|Ana|Guy|Sara|Nova|Emma|Christopher|Eric)/i,/Aria/i,/Jenny/i,/Google US English/i,/Samantha/i,/^Alex$/i,/Evan|Nathan|Aaron|Tom/i];
  for(const re of pref){const v=vs.find(x=>re.test(x.name||'')&&/^en/i.test(x.lang||'')&&notGB(x));if(v){ttsVoice=v;return v;}}
  const v=vs.find(x=>/^en(-|_)?us/i.test(x.lang||''))||vs.find(x=>/^en/i.test(x.lang||'')&&notGB(x))||vs.find(x=>/^en/i.test(x.lang||''));
  if(v)ttsVoice=v;return v||null;}
function ttsLocal(text,targetSecs){try{const u=new SpeechSynthesisUtterance(text);
  const est=text.split(/\s+/).length/2.7;
  u.rate=ttsNeededRate(est,targetSecs);
  const v=ttsPickVoice();
  if(v)u.voice=v;speechSynthesis.speak(u);}catch(e){}}
const ttsCache=new Map();
function ttsFetchBlob(text){if(ttsCache.has(text)){const v=ttsCache.get(text);ttsCache.delete(text);ttsCache.set(text,v);return v;}
  const p=fetch('http://localhost:8765/tts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:text})})
    .then(r=>{if(!r.ok)throw new Error('http '+r.status);return r.blob();});
  p.catch(()=>{ttsCache.delete(text);});
  ttsCache.set(text,p);
  while(ttsCache.size>40){ttsCache.delete(ttsCache.keys().next().value);}
  return p;}
let ttsPrefetchTok=null;
async function ttsPrefetch(texts){if(!ttsOn||ttsNeuralDead)return;const tok={};ttsPrefetchTok=tok;
  for(const t of texts){if(ttsPrefetchTok!==tok||ttsNeuralDead)return;
    try{await ttsFetchBlob(t);}catch(e){return;}}}
function cardText(q){const cs=choicesFor(q).filter(c=>c.c);
  let t='Question. '+q.stem+' Answer: '+cs.map(c=>c.t).join('. ');
  if(expIsOpen(q.id))t+=' Explanation: '+q.exp;return t;}
let ttsFails=0,ttsDeadAt=0;
async function speak(text,targetSecs,force){if((!ttsOn&&!force)||!text)return;ttsStop();const tok={};ttsToken=tok;
  text=String(text).slice(0,6000);
  if(ttsNeuralDead&&(performance.now()-ttsDeadAt)>12000){ttsNeuralDead=false;ttsFails=0;}
  if(!ttsNeuralDead){try{
    const b=await ttsFetchBlob(text);if(ttsToken!==tok)return;
    const a=ttsElement();
    if(a.src&&a.src.indexOf('blob:')===0){try{URL.revokeObjectURL(a.src)}catch(e){}}
    a.muted=false;a.src=URL.createObjectURL(b);a.playbackRate=Math.min(3,Math.max(0.5,ttsRate));
    a.onloadedmetadata=()=>{a.playbackRate=ttsNeededRate(a.duration,targetSecs);};
    ttsAudio=a;
    a.play().catch(()=>{if(ttsToken===tok)ttsLocal(text,targetSecs);});
    ttsFails=0;
    return;
  }catch(e){ttsFails++;if(ttsFails>=3){ttsNeuralDead=true;ttsDeadAt=performance.now();}}}
  if(ttsToken!==tok)return;ttsLocal(text,targetSecs);}
function speakCard(q){speak(cardText(q),(typeof clockOn!=='undefined'&&clockOn)?speedSecs:null);
  if(!ttsNeuralDead&&q.exp&&!expIsOpen(q.id))ttsFetchBlob('Explanation: '+q.exp).catch(()=>{});}

let rafId=null;
function stopBar(){if(rafId){cancelAnimationFrame(rafId);rafId=null;}}
function clearNotePause(){barSuspended=false;document.body.classList.remove('notepaused');}
function runBar(el,seconds,onDone,tickEl,fullSecs){if(!el)return;const start=performance.now(),dur=seconds*1000;
  const total=fullSecs||seconds;
  barS={start:start,secs:seconds,total:total,el:el,onDone:onDone,tick:tickEl};
  function step(now){const left=Math.max(0,seconds-(now-start)/1000);const frac=Math.max(0,left/total);el.style.width=(frac*100)+'%';
    el.classList.toggle('warn',frac<=0.25&&frac>0.10);el.classList.toggle('crit',frac<=0.10);
    if(tickEl)tickEl.textContent=Math.max(0,Math.ceil(left))+'s';
    if(now-start>=dur){rafId=null;onDone();return;}rafId=requestAnimationFrame(step);}
  stopBar();rafId=requestAnimationFrame(step);}

function esc(s){return s.replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}
function hl(s){if(!query)return esc(s);const lo=s.toLowerCase(),ql=query.toLowerCase();let out='',p=0,i;
  while((i=lo.indexOf(ql,p))>=0){out+=esc(s.slice(p,i))+'<mark>'+esc(s.slice(i,i+query.length))+'</mark>';p=i+query.length;}
  return out+esc(s.slice(p));}
function matches(q){if(!query)return true;return (q.stem+' '+q.choices.map(c=>c.t).join(' ')+' '+q.exp).toLowerCase().includes(query.toLowerCase())}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function hasFigs(){return D.questions.some(q=>q.fig);}
function allCats(){const a=D.cats.slice();if(hasFigs())a.push(FIGCAT);if(missedEver.size)a.push(MISSCAT);return a;}
function qsFor(c){if(c==='All')return D.questions.slice();
  if(c===FIGCAT)return D.questions.filter(q=>q.fig);
  if(c===MISSCAT)return D.questions.filter(q=>missedEver.has(q.id));
  return D.questions.filter(q=>q.cat===c);}
function catQuestions(c){return qsFor(c).sort((x,y)=>seq==='a'?x.a-y.a:x.b-y.b);}
function pool(){let a=qsFor(query?'All':activeCat).filter(q=>matches(q)&&(!markedOnly||marks.has(q.id)));
  a.sort((x,y)=>seq==='a'?x.a-y.a:x.b-y.b);return a;}
function subsetOf(items,pct){if(pct>=100||items.length<2)return items;
  const n=Math.max(1,Math.round(items.length*pct/100));
  const score=q=>{const t=qtest[q.id],l=qlast[q.id];let s=Math.random()*3;
    if(l==='wrong'||l==='timeout')s+=100;
    if(marks.has(q.id))s+=60;
    if(!t)s+=40;else{s+=(1-(t.c/Math.max(1,t.a)))*50;s+=Math.max(0,10-t.a);}
    if(!reviewed.has(q.id))s+=15;
    if(q.var)s+=12;
    return s;};
  return items.slice().sort((a,b)=>score(b)-score(a)).slice(0,n);}
function choicesFor(q){if(answers==='correct')return q.choices.filter(c=>c.c).map(c=>({l:c.l,t:c.t,c:true}));
  if(!shuffleOn)return q.choices.map(c=>({l:c.l,t:c.t,c:c.c}));
  if(!q._sh)q._sh=shuffle(q.choices);const L=['A','B','C','D'];return q._sh.map((c,i)=>({l:L[i],t:c.t,c:c.c}));}

function expIsOpen(id){return expOpen.has(id)?true:expOpen.has('!'+id)?false:expOn;}
function figSrc(f){return f?FIGS[(D.figpfx||'')+f]:null;}
function figAttr(v){return v.startsWith('enc:')?`src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" data-enc="${esc(v.slice(4))}"`:`src="${v}"`;}
function figHTML(q){const fs=[q.fig,q.fig2].filter(figSrc);if(!fs.length)return '';
  return `<div class="figbox">${fs.map(f=>`<img class="figimg" ${figAttr(figSrc(f))} alt="Figure ${esc(f)}"><div class="figcap">Figure ${esc(f)} \u00b7 click to enlarge</div>`).join('')}</div>`;}
function varWarn(q){return (q.var||q.cg)?`<span class="vwarn" title="Another question uses this same wording but has a different correct answer \u2014 read the choices carefully.">\u26a0 look-alike</span>`:'';}
function choiceText(q,c){
  if(c.c&&cueOn&&!query&&answers!=='all')return cueHTML(q,c.t);
  return hl(c.t);}
function cardHTML(q,single,withBar){
  const ch=choicesFor(q).map(c=>`<div class="choice${(answers!=='all'&&c.c)?' correct':''}"><span class="lt">${c.l})</span><span>${choiceText(q,c)}</span></div>`).join('');
  const open=expIsOpen(q.id),on=marks.has(q.id);
  const hb=(activeCat===MISSCAT)?(marks.has(q.id)?`<span class="rbadge wrong">✗ still missing</span>`:`<span class="rbadge right" style="background:var(--goodbg);border-color:var(--goodline);color:var(--good)">✓ cleared</span>`):'';
  const r=qlast[q.id];const badge=hb+((r&&activeCat!==MISSCAT)?`<span class="rbadge ${r}">${r==='timeout'?'<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6"/></svg> timed out':r==='wrong'?'✗ missed':'✓ correct'}</span>`:'')+(q.fig?`<span class="figchip">FIG ${esc(q.fig)}${q.fig2?'/'+esc(q.fig2):''}</span>`:'')+varWarn(q)+((q.tight&&answers!=='all')?'<span class="tightchip">\u26a0 exact wording</span>':'');
  const qcard=`<div class="card" data-id="${q.id}">${withBar?'<div class="timebar" id="tbedge"></div>':''}
    <div class="qmeta"><span class="qleft"><span class="qtag">${esc(q.cat)}</span><span class="qid">#${esc(q.id)}</span>${badge}</span>
      <span class="qactions"><button class="mini expbtn">${open?'− Explanation':'+ Explanation'}</button>
      <button class="flag${on?' on':''}" title="Mark for review"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.3 6.4 20.2l1.1-6.2L3 9.6l6.2-.9z"/></svg></button></span></div>

/* ---------- TEST ENGINE ---------- */
let tActive=false,tOrder=[],tIdx=0,tScore=0,tWrong=[],tWR=0,tTO=0,tAnswered=false,testCtx='test',lastTestItems=[],tQStart=0;

/* ---- soft pause: stop the clock but leave the question on screen ---- */
function barSuspend(){
  if(barSuspended||!rafId||!barS.el||!barS.onDone)return;
  barLeftNote=Math.max(0.6,barS.secs-(performance.now()-barS.start)/1000);
  stopBar();barSuspended=true;

function barResumeNote(){
  if(!barSuspended)return;
  barSuspended=false;document.body.classList.remove('notepaused');
  const el=document.getElementById(barS.el.id)||barS.el;
  if(document.body.contains(el))runBar(el,barLeftNote,barS.onDone,barS.tick,barS.total);}

/* ---- save / resume any test in progress ---- */
function saveTest(){if(!tActive||!tOrder.length)return;
  store.set(PFX+'tsave',{ids:tOrder.map(q=>q.id),i:tIdx,sc:tScore,wr:tWR,to:tTO,wrong:tWrong,
    ctx:testCtx,drill:testDrill,left:tPaused?tLeft:0,stage:currentStage,chunk:studyChunk,picks:tPicks,ts:Date.now()});}
function clearTest(){store.set(PFX+'tsave',null);}
function loadTest(){const s=store.get(PFX+'tsave',null);
  return (s&&s.ids&&s.ids.length&&s.i<s.ids.length)?s:null;}
function resumeSaved(s){const by={};D.questions.forEach(q=>by[q.id]=q);
  const items=s.ids.map(id=>by[id]).filter(Boolean);
  if(items.length!==s.ids.length)return false;
  tActive=true;tOrder=items;tOrder.forEach(q=>delete q._tsh);tIdx=s.i||0;tScore=s.sc||0;
  tWR=s.wr||0;tTO=s.to||0;tWrong=s.wrong||[];testCtx=s.ctx||'test';testDrill=!!s.drill;
  lastTestItems=items;tPaused=false;tResumeLeft=s.left||0;tAnswered=false;tPicks=s.picks||{};tReview=-1;
  renderTest();return true;}

function pauseTest(){if(!tActive||tPaused||tAnswered)return;
  barSuspended=false;document.body.classList.remove('notepaused');
  tPaused=true;
  tLeft=(tOrder[tIdx]&&tOrder[tIdx].fig)?0:Math.max(1,barS.secs-(performance.now()-barS.start)/1000);
  stopBar();ttsStop();saveTest();renderPause();}
function renderPause(){
  wrap.classList.add('testing');
  content.innerHTML=`<div class="card"><div class="tdone"><div>Paused</div>
    <div class="big">${tIdx+1} / ${tOrder.length}</div>
    <div style="color:var(--muted)">\u2713 ${tScore} \u00b7 \u2717 ${tWrong.length} \u00b7 ${tLeft?Math.ceil(tLeft)+'s left on this question':'untimed figure question'}</div>
    <p><button class="btn active" id="pResume" style="padding:9px 18px">Resume \u25b8</button>
       <button class="btn" id="pExit" style="padding:9px 18px">Save &amp; exit</button></p>
    <div style="color:var(--muted);font-size:12px;margin-top:6px">Saved. You can close the tab and pick this up later.</div></div></div>`;
  document.getElementById('pResume').onclick=()=>{tPaused=false;tResumeLeft=tLeft;renderTest();};
  document.getElementById('pExit').onclick=()=>{tActive=false;tPaused=false;wrap.classList.remove('testing');
    if(mode==='study'&&studyPhase==='test'){studyPhase='review';saveStudyPos();}

  document.getElementById('showing').textContent='paused';}
function buildRandom100(){const target=100;let picks=[];
  D.cats.forEach(c=>{const qs=D.questions.filter(q=>q.cat===c);const n=Math.round(qs.length/D.questions.length*target);picks.push(...shuffle(qs).slice(0,n));});
  picks=shuffle(picks);
  if(picks.length>target)picks=picks.slice(0,target);
  else if(picks.length<target){const have=new Set(picks.map(q=>q.id));const rest=shuffle(D.questions.filter(q=>!have.has(q.id)));picks.push(...rest.slice(0,target-picks.length));}
  return picks;}
let testDrill=false,testType='normal',testScope='random',qstreak={},drillKey='all';

function recordTest(q,type){qtest[q.id]=qtest[q.id]||{a:0,c:0};qtest[q.id].a++;if(type==='right')qtest[q.id].c++;
  if(type!=='right'){missedEver.add(q.id);store.set(PFX+'misshist',[...missedEver]);}
  qlast[q.id]=type;store.set(PFX+'test',qtest);store.set(PFX+'qlast',qlast);}
function pick(el,q){if(tAnswered)return;tAnswered=true;stopBar();
  tPicks[tIdx]={i:+el.dataset.i,ok:el.dataset.c==='1'};
  document.querySelectorAll('#tchoices .tchoice').forEach(x=>x.classList.add('disabled'));

  if(ok){el.classList.add('pick-correct');tScore++;schedRate(q.id,2);if(!testDrill&&marks.has(q.id)){marks.delete(q.id);delete qstreak[q.id];store.set(PFX+'marks',[...marks]);store.set(PFX+'qstreak',qstreak);}if(overconf[q.id]){delete overconf[q.id];store.set(PFX+'overconf',overconf);}
    if(testDrill){const s=(qstreak[q.id]||0)+1;if(s>=DRILL_TARGET){marks.delete(q.id);delete qstreak[q.id];}else{qstreak[q.id]=s;}store.set(PFX+'qstreak',qstreak);store.set(PFX+'marks',[...marks]);}}
  else{el.classList.add('pick-wrong');tWrong.push(q.id);tWR++;marks.add(q.id);qstreak[q.id]=0;store.set(PFX+'marks',[...marks]);store.set(PFX+'qstreak',qstreak);
    if(tQStart&&(performance.now()-tQStart)<speedSecs*400){overconf[q.id]=1;store.set(PFX+'overconf',overconf);}
    schedRate(q.id,0);
    document.querySelectorAll('#tchoices .tchoice').forEach(x=>{if(x.dataset.c==='1')x.classList.add('show-correct');});
    const tb2=document.querySelector('.tbar span:last-child');if(tb2)tb2.innerHTML+=' &nbsp;<span style="color:var(--muted);font-size:11.5px">space \u2192 next</span>';}
  recordTest(q,ok?'right':'wrong');tNextT=setTimeout(next,ok?1500:4000);}
function timeUp(q){if(tAnswered)return;tAnswered=true;tPicks[tIdx]={i:-1,ok:false,to:1};tWrong.push(q.id);tTO++;marks.add(q.id);qstreak[q.id]=0;store.set(PFX+'marks',[...marks]);store.set(PFX+'qstreak',qstreak);

/* ================= SPACED SCHEDULER (Leitner) ================= */
const BOXMIN=[10,120,1440,4320,10080];
let sched={},overconf={};
let cueOn=store.get('ft5_cueon',true);
function schedOf(id){return sched[id]||null;}
function isDue(q){const s=sched[q.id];return !s||Date.now()>=s.d;}
function isSeen(q){return !!sched[q.id];}
function dueNow(){return D.questions.filter(q=>isSeen(q)&&isDue(q));}
function schedRate(id,r){const s=sched[id]||{b:0,l:0};let b=s.b||0,l=s.l||0;
  if(r===2)b=Math.min(BOXMIN.length-1,b+1);
  else if(r===0){b=0;l++;}
  const mins=r===0?5:(r===1?10:BOXMIN[b]);
  sched[id]={b:b,l:l,r:r,d:Date.now()+mins*60000};
  store.set(PFX+'sched',sched);}
function schedReset(id){delete sched[id];store.set(PFX+'sched',sched);}
function dueLabel(q){const s=sched[q.id];if(!s)return 'new';
  const m=Math.round((s.d-Date.now())/60000);
  if(m<=0)return 'due';
  if(m<60)return m+'m';
  if(m<1440)return Math.round(m/60)+'h';
  return Math.round(m/1440)+'d';}

/* ================= CUE HELPERS ================= */
function cueHTML(q,text){if(!q.cue||!q.cue.length)return esc(text);
  let out=esc(text);
  q.cue.forEach(w=>{const safe=w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    try{out=out.replace(new RegExp('('+safe+')','ig'),'<b class="cuew">$1</b>');}catch(e){}});
  return out;}
function cueChips(q){if(!q.cue||!q.cue.length)return '<div class="cuechips"><span class="cuechip">no unique word — exact wording matters</span></div>';
  return '<div class="cuechips">'+q.cue.map(w=>`<span class="cuechip">${esc(w)}</span>`).join('')+'</div>';}

/* ================= RECALL MODE ================= */
let rcRun=false,rcOrder=[],rcIdx=0,rcShown=0,rcSel=null,rcStyle='full',rcType='recall';
let rcG=0,rcS=0,rcN=0,rcCtx='menu',rcOnDone=null,rcOnBack=null,rcHeader='';

function rcPool(sel){
  let items;
  if(sel==='due')items=dueNow();
  else items=qsFor(sel).slice();
  items.sort((a,b)=>{
    const sa=sched[a.id],sb=sched[b.id];
    const ra=sa?(isDue(a)?0:2):1, rb=sb?(isDue(b)?0:2):1;
    if(ra!==rb)return ra-rb;
    return ((sa&&sa.b)||0)-((sb&&sb.b)||0);});
  return items;}

function rcStartInline(chunk,header,onDone,onBack){
  rcCtx='study';rcOrder=chunk.slice();rcIdx=0;rcShown=0;rcG=rcS=rcN=0;

function rcRate(r){const q=rcOrder[rcIdx];if(!q)return;

/* ================= LOOK-ALIKE DRILL ================= */
function confGroups(scope){
  const src=scope==='All'?D.questions:qsFor(scope);
  const by={};
  src.forEach(q=>{if(q.cg)(by[q.cg]=by[q.cg]||[]).push(q);});
  return Object.keys(by).map(k=>by[k]).filter(g=>g.length>1);}

function renderLook(){
  if(!rcRun){
    const cats=allCats(),tot=confGroups('All');
    const opts=`<button class="topt${rcSel==='All'?' active':''}" data-s="All">All categories <span>${tot.length} sets</span></button>`+
      cats.map(c=>{const g=confGroups(c);return g.length?`<button class="topt${rcSel==='cat:'+c?' active':''}" data-s="cat:${esc(c)}">${esc(c)} <span>${g.length} sets</span></button>`:'';}).join('');
    content.innerHTML=`<div class="tsetup"><h2>Look-alike drill</h2>
      <p>These questions are worded almost identically but have <b>different</b> answers — the most common way to lose points. You'll see one stem and the answers from every look-alike in its set.</p>
      <div class="slabel" style="text-align:left;max-width:420px;margin:8px auto 5px">Drill</div>
      <div class="rcseg"><button class="btn" id="rtRecall">Recall</button><button class="btn active" id="rtLook">Look-alikes</button></div>
      <div class="slabel" style="text-align:left;max-width:420px;margin:2px auto 5px">Category</div>
      <div class="testopts">${opts||'<div class="empty">No look-alike sets in this course.</div>'}</div>
      <p><button class="btn active" id="laStart" style="padding:10px 22px;font-size:15px">Start ▸</button></p></div>`;
    document.getElementById('showing').textContent='look-alike menu';
    content.querySelectorAll('.topt').forEach(b=>b.onclick=()=>{rcSel=b.dataset.s;renderLook();});
    document.getElementById('rtRecall').onclick=()=>{rcType='recall';renderRecall();};
    document.getElementById('laStart').onclick=()=>{
      const sc=(!rcSel||rcSel==='All')?'All':rcSel.slice(4);
      const gs=confGroups(sc);
      if(!gs.length){alert('No look-alike sets there.');return;}
      laGroup=[];gs.forEach(g=>{shuffle(g).forEach(q=>{
        const texts=[...new Set(g.map(p=>correctText(p)))];
        if(texts.length>1&&texts.indexOf(correctText(q))>=0)laGroup.push({q:q,peers:g,texts:texts});});});
      laGroup=shuffle(laGroup);laIdx=0;laRight=0;laWrong=0;laAnswered=false;rcRun=true;renderLook();};
    return;}
  renderLookCard();}

function renderLookCard(){
  if(laIdx>=laGroup.length){
    const tot=laGroup.length;
    content.innerHTML=`<div class="card"><div class="rcdone"><div>Look-alike drill done</div>
      <div class="big">${laRight} / ${tot}</div>
      <div style="color:var(--muted)">These are the ones that trip people up — worth repeating.</div>
      <p><button class="btn active" id="laAgain" style="padding:9px 18px">Run again</button>
         <button class="btn" id="laMenu" style="padding:9px 18px">Menu</button></p></div></div>`;
    document.getElementById('laAgain').onclick=()=>{laGroup=shuffle(laGroup);laIdx=0;laRight=0;laWrong=0;laAnswered=false;renderLookCard();};
    document.getElementById('laMenu').onclick=()=>{rcRun=false;renderLook();};
    document.getElementById('showing').textContent='drill done';return;}
  const it=laGroup[laIdx],q=it.q;laAnswered=false;
  const ct=correctText(q);
  const choices=shuffle(it.texts.map(t=>({t:t,c:t===ct})));
  content.innerHTML=`<div class="rcbar"><span>Set ${laIdx+1} / ${laGroup.length}</span><span>✓ ${laRight} &nbsp; ✗ ${laWrong}</span></div>
    <div class="card">
      <div class="qmeta"><span class="qleft"><span class="qtag">${esc(q.cat)}</span><span class="qid">#${esc(q.id)}</span><span class="vwarn"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.3 3.9L2 18a2 2 0 001.7 3h16.6a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg>look-alike set of ${it.texts.length}</span></span></div>
      <div class="qsplit${q.fig?' two':''}"><div class="qtext">
      <p class="stem">${esc(q.stem)}</p>
      <div class="lawarn">Another question in this bank is worded almost the same but answers differently. Which answer belongs to <b>this</b> one?</div>
      <div id="lachoices">${choices.map((c,i)=>`<div class="lachoice" data-c="${c.c?1:0}"><span class="lt">${String.fromCharCode(65+i)})</span><span>${esc(c.t)}</span></div>`).join('')}</div>
      </div>${figHTML(q)}</div></div>`;
  document.getElementById('showing').textContent='look-alike '+(laIdx+1)+'/'+laGroup.length;
  content.querySelectorAll('.lachoice').forEach(el=>el.onclick=()=>laPick(el,q));}

function laPick(el,q){if(laAnswered)return;laAnswered=true;
  const ok=el.dataset.c==='1';
  content.querySelectorAll('.lachoice').forEach(x=>x.classList.add('disabled'));
  if(ok){el.classList.add('pick-correct');laRight++;schedRate(q.id,2);}
  else{el.classList.add('pick-wrong');laWrong++;laAnswered=true;schedRate(q.id,0);
    marks.add(q.id);store.set(PFX+'marks',[...marks]);
    content.querySelectorAll('.lachoice').forEach(x=>{if(x.dataset.c==='1')x.classList.add('show-correct');});}
  recordTest(q,ok?'right':'wrong');
  setTimeout(()=>{laIdx++;renderLookCard();renderSide();},ok?900:4000);}

/* keyboard: space reveals, 1/2/3 rate */
document.addEventListener('keydown',e=>{
  if(mode!=='recall'||!rcRun||e.metaKey||e.ctrlKey||e.altKey)return;
  const ae=document.activeElement;if(ae&&/^(input|textarea|select)$/i.test(ae.tagName))return;
  if(rcType==='look'){
    const m={'1':0,'2':1,'3':2,a:0,b:1,c:2}[e.key.toLowerCase()];
    if(m!==undefined){const el=document.querySelectorAll('#lachoices .lachoice')[m];if(el){e.preventDefault();el.click();}}
    return;}
  if(e.key===' '||e.key==='Enter'){const b=document.getElementById('rcRev')||document.getElementById('rcRev2');
    if(b){e.preventDefault();b.click();}return;}
  if(!rcShown)return;
  if(rcStyle==='cue'&&rcShown===1)return;
  const m={'1':0,'2':1,'3':2}[e.key];
  if(m!==undefined){e.preventDefault();rcRate(m);}});

let notesTxt='',noteSaveT=null;
function currentQ(){
  if(mode==='test'&&tActive&&tReview>=0&&tOrder[tReview])return tOrder[tReview];
  if(mode==='test'&&tActive&&tOrder[tIdx])return tOrder[tIdx];
  if(mode==='recall'&&rcRun&&rcOrder[rcIdx])return rcOrder[rcIdx];

  return el?QID[el.dataset.id]:null;}
function notesSave(){notesTxt=document.getElementById('notesTA').value;
  store.set(PFX+'notes',notesTxt);notesCount();}
function notesCount(){const c=document.getElementById('nCount');if(!c)return;
  const n=notesTxt.trim()?notesTxt.trim().split(/\n+/).length:0;
  c.textContent=n?n+' line'+(n===1?'':'s'):'';}
function notesLoad(){notesTxt=store.get(PFX+'notes','');
  const ta=document.getElementById('notesTA');if(ta)ta.value=notesTxt;notesCount();}
function notesInsert(txt){const ta=document.getElementById('notesTA');if(!ta)return;
  const s=ta.selectionStart||ta.value.length;
  const before=ta.value.slice(0,s),after=ta.value.slice(s);
  const pad=(before&&!before.endsWith('\n'))?'\n':'';
  ta.value=before+pad+txt+after;
  const pos=(before+pad+txt).length;ta.focus();ta.setSelectionRange(pos,pos);
  notesSave();}
function bindNotes(){
  const ta=document.getElementById('notesTA');
  notesLoad();
  ta.addEventListener('focus',barSuspend);
  ta.addEventListener('keydown',barSuspend);
  document.getElementById('notecol').addEventListener('mousedown',barSuspend);
  document.getElementById('notecol').addEventListener('touchstart',barSuspend,{passive:true});
  ta.addEventListener('input',()=>{barSuspend();clearTimeout(noteSaveT);noteSaveT=setTimeout(notesSave,400);});
  ta.addEventListener('blur',notesSave);
  document.getElementById('nTag').onclick=()=>{const q=currentQ();
    if(!q){notesInsert('- ');return;}
    const u=(D.units||[]).find(x=>x.ids.indexOf(q.id)>=0);
    const tag='['+(u?u.cat+' '+u.letter:q.cat)+' #'+q.id+'] '+q.stem.replace(/\s+/g,' ').slice(0,90);
    notesInsert(tag+'\n  - ');};
  document.getElementById('nStamp').onclick=()=>{const d=new Date();
    notesInsert('\n=== '+d.toLocaleDateString()+' '+d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})+' ===\n');};
  document.getElementById('nDownload').onclick=()=>{
    const blob=new Blob([document.getElementById('notesTA').value],{type:'text/plain'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);
    a.download=(course||'study')+'_notes.txt';document.body.appendChild(a);a.click();a.remove();};
  document.getElementById('nClear').onclick=()=>{if(confirm('Clear all notes for this course?')){
    document.getElementById('notesTA').value='';notesSave();}};
  document.getElementById('noteToggle').onclick=()=>{
    const on=document.body.classList.toggle('notes');
    store.set('ft5_noteson',on);
    document.getElementById('noteToggle').classList.toggle('on',on);
    if(on)setTimeout(()=>document.getElementById('notesTA').focus(),50);else barResumeNote();};
  // clicking back on the question area resumes the clock
  document.querySelector('.appcol').addEventListener('mousedown',()=>{if(barSuspended)barResumeNote();});
  document.querySelector('.appcol').addEventListener('touchstart',()=>{if(barSuspended)barResumeNote();},{passive:true});
  if(store.get('ft5_noteson',false))document.body.classList.add('notes');}

function pctOf(n,d){return d?Math.round(n/d*100):0;}
function unitState(u){const ids=u.ids||[];const n=ids.length;
  const rev=ids.filter(id=>reviewed.has(id)).length;
  let a=0,c=0,miss=0;
  ids.forEach(id=>{const t=qtest[id];if(t){a+=t.a;c+=t.c;}if(marks.has(id))miss++;});
  return {n:n,rev:rev,revp:n?Math.round(rev/n*100):0,acc:a?Math.round(c/a*100):null,
          miss:miss,done:planDone.has(u.id)};}
function unitChips(cat){const us=unitsFor(cat);if(!us.length)return '';
  return '<div class="uchips">'+us.map(u=>{const s=unitState(u);
    const cls=s.done?'done':(s.revp>=100?'full':(s.rev>0?'part':''));
    const cur=STEPS[currentStage]&&STEPS[currentStage].id===u.id;
    const tip=u.cat+' '+u.letter+' \u2014 '+s.rev+'/'+s.n+' read'+(s.acc!=null?', '+s.acc+'% on tests':'')+(s.miss?', '+s.miss+' marked':'');
    return `<button class="uchip ${cls}${cur?' cur':''}" data-u="${esc(u.id)}" title="${esc(tip)}">${u.letter}</button>`;
  }).join('')+'</div>';}
function goToStep(id){const i=STEPS.findIndex(s=>s.id===id);if(i<0)return;
  currentStage=i;saveStage();mode='study';tActive=false;tPaused=false;rcRun=false;clockOn=false;
  studyReset();buildPlan();render();
  if(window.innerWidth<=900)wrap.classList.remove('mobnav');}
function nextUp(){
  const sv=loadTest();
  if(sv)return {t:'\u23f8 Resume your test',s:'question '+((sv.i||0)+1)+' of '+sv.ids.length,go:'resume',lbl:'Resume \u25b8'};
  const due=dueNow().length;
  if(due>=10)return {t:'Recall '+due+' due',s:'spaced review is owed \u2014 clear these first',go:'recall',lbl:'Start recall \u25b8'};
  const st=STEPS[currentStage];
  if(st&&st.kind==='read'&&st.ids){const s=unitState(st);
    if(s.rev<s.n)return {t:'Continue '+st.cat+' '+st.letter,s:'set '+(studyChunk+1)+' \u00b7 '+s.rev+'/'+s.n+' read',go:'study',lbl:'Continue \u25b8'};}
  const nx=STEPS.findIndex(x=>x.kind==='read'&&x.ids&&unitState(x).rev<x.ids.length);
  if(nx>=0)return {t:'Start '+STEPS[nx].cat+' '+STEPS[nx].letter,s:STEPS[nx].ids.length+' questions \u00b7 '+(STEPS[nx].label||'next unread set'),go:'step',id:STEPS[nx].id,lbl:'Start \u25b8'};
  if(due>0)return {t:'Recall '+due+' due',s:'everything read \u2014 keep it warm',go:'recall',lbl:'Start recall \u25b8'};
  if(marks.size)return {t:'Drill '+marks.size+' missed',s:'all units read \u2014 narrow down the stubborn ones',go:'drill',lbl:'Drill \u25b8'};
  return {t:'All units read',s:'run a full timed test to confirm',go:'test',lbl:'Test \u25b8'};}
function catAgg(){return D.cats.map(c=>{const qs=D.questions.filter(q=>q.cat===c);
  const rev=qs.filter(q=>reviewed.has(q.id)).length;let a=0,cc=0;
  qs.forEach(q=>{const t=qtest[q.id];if(t){a+=t.a;cc+=t.c;}});
  return {c,total:qs.length,rev,a,cc,acc:a?cc/a:null,revp:rev/qs.length};});}

      ${D.cats.map(c=>unitsFor(c).length?`<div class="catname" style="margin-top:9px"><span>${esc(c)}</span><span>${unitsFor(c).filter(u=>{const s=unitState(u);return s.done||s.revp>=100;}).length}/${unitsFor(c).length}</span></div>${unitChips(c)}`:'').join('')}
      <div class="ulegend"><i><span class="ubox" style="background:var(--chip)"></span>not started</i>
        <i><span class="ubox" style="background:var(--accentsoft)"></span>part way</i>
        <i><span class="ubox" style="background:var(--goodsoft)"></span>read</i>
        <i><span class="ubox" style="background:var(--good)"></span>checked off</i></div>
      <div style="font-size:11px;color:var(--muted);margin-top:6px">Tap any letter to jump straight to that set.</div></div>
    <div class="sbox"><h3>Overall</h3>
      <div class="srow"><span>Reviewed</span><b>${totRev}/${totQ} · ${pctOf(totRev,totQ)}%</b></div>

function studyStageFor(cat){return STEPS.findIndex(s=>s.kind==='read'&&s.cat===cat);}
function unitsFor(cat){return STEPS.filter(s=>s.kind==='read'&&s.cat===cat);}
function jumpToCategory(cat){const i=studyStageFor(cat);if(i<0)return false;
  currentStage=i;saveStage();
  activeCat=cat;store.set(PFX+'cat',cat);
  mode='study';tActive=false;tPaused=false;rcRun=false;clockOn=false;
  studyReset();buildPlan();render();

  return true;}
function categoriesHTML(){
  let h='<div class="slabel" style="margin-bottom:8px">Categories</div>'+
    '<div style="font-size:11.5px;color:var(--muted);margin:-2px 0 9px">Tap \u25b8 to jump the study plan straight to that category.</div>';

  allCats().forEach(c=>{const qs=qsFor(c),n=qs.length;
    const rev=qs.filter(q=>reviewed.has(q.id)).length,rp=n?Math.round(rev/n*100):0;
    const us=unitsFor(c);
    const si=studyStageFor(c),cur=si>=0&&STEPS[currentStage]&&STEPS[currentStage].cat===c&&STEPS[currentStage].kind==='read';
    const done=us.length>0&&us.every(u=>planDone.has(u.id));

       `<b>${esc(c)}</b>`+

       (si>=0?`<button class="catjump" data-j="${esc(c)}" title="Study ${esc(c)} now">\u25b8</button>`:'')+
       `</div>`;});
  return h;}
function bindCategories(el){
  el.querySelectorAll('.catjump').forEach(b=>b.onclick=e=>{e.stopPropagation();jumpToCategory(b.dataset.j);});

/* ---------- STAGE NAV ---------- */
function saveStage(){store.set(PFX+"stage",currentStage);
  store.set(PFX+"stageid",STEPS[currentStage]?STEPS[currentStage].id:null);}
function nextStage(){if(currentStage<STEPS.length){planDone.add(STEPS[currentStage].id);store.set(PFX+'plan',[...planDone]);}
  currentStage=Math.min(currentStage+1,STEPS.length);saveStage();
  studyReset();tActive=false;buildPlan();render();}
function prevStage(){currentStage=Math.max(0,currentStage-1);saveStage();studyReset();tActive=false;buildPlan();render();}

/* ---------- EXPORT / IMPORT ---------- */
function exportData(){const data={v:3,marks:[...marks],plan:[...planDone],reviewed:[...reviewed],qtest,qlast,stage:currentStage,speed:speedSecs,cat:activeCat,notes:notesTxt,sched:sched,misshist:[...missedEver]};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');

  r.onload=()=>{try{const d=JSON.parse(r.result);marks=new Set(d.marks||[]);planDone=new Set(d.plan||[]);reviewed=new Set(d.reviewed||[]);
    qtest=d.qtest||{};qlast=d.qlast||{};currentStage=d.stage||0;if(d.speed)speedSecs=d.speed;if(d.cat)activeCat=d.cat;

    store.set(PFX+'marks',[...marks]);store.set(PFX+'plan',[...planDone]);store.set(PFX+'rev',[...reviewed]);store.set(PFX+'test',qtest);store.set(PFX+'qlast',qlast);saveStage();store.set(PFX+'speed',speedSecs);store.set(PFX+'cat',activeCat);
    buildPlan();render();alert('Progress loaded.');}catch(err){alert('Could not read that file.');}};r.readAsText(f);e.target.value='';};

/* ---------- PLAN PANEL + STEPS ---------- */
function buildSteps(){const s=[];
  D.cats.forEach(c=>{
    const us=(D.units||[]).filter(u=>u.cat===c);
    if(us.length)us.forEach(u=>s.push({id:'s1_'+c+'|'+u.letter,ph:'Phase 1 — Learn each category',
      lbl:c+' '+u.letter+(u.label?' \u00b7 '+u.label:'')+' \u00b7 '+u.ids.length+' Q',
      kind:'read',cat:c,ids:u.ids,letter:u.letter,label:u.label}));
    else s.push({id:'s1_'+c,ph:'Phase 1 — Learn each category',lbl:c+' · Step 1: Read-through',kind:'read',cat:c});
    s.push({id:'s2_'+c,ph:'Phase 1 — Learn each category',lbl:c+' \u00b7 Self-test: whole category',kind:'selftest',cat:c});});
  s.push({id:'s3',ph:'Phase 2 — Full review (Step 3)',lbl:'Timed test, all categories',kind:'fulltest'});
  s.push({id:'s4',ph:'Phase 3 — Marked review (Step 4)',lbl:'Review your flagged questions',kind:'markedreview'});
  s.push({id:'s5',ph:'Phase 4 — Practice tests (Step 5)',lbl:'Practice tests in the app until 90%+',kind:'practice'});
  return s;}
let STEPS=[];
function buildPlan(){const total=STEPS.length,done=STEPS.filter(s=>planDone.has(s.id)).length;
  let phases=[],cur=null;STEPS.forEach(s=>{if(!cur||cur.name!==s.ph){cur={name:s.ph,items:[]};phases.push(cur);}cur.items.push(s);});
  let html=`<div class="phdr"><h2>Sheppard Study Strategy — your progress</h2><div class="goal">Target: finish all 5 steps in ~14 days (21 max). <b id="pcount">${done}</b>/${total} done.</div><div class="bar"><i id="pfill" style="width:${Math.round(done/total*100)}%"></i></div></div><div class="pbody">`;
  phases.forEach(p=>{html+=`<div class="phase"><div class="pt">${esc(p.name)}</div>`;
    p.items.forEach(s=>{const idx=STEPS.indexOf(s);html+=`<div class="step${planDone.has(s.id)?' done':''}" data-id="${s.id}"><input type="checkbox" ${planDone.has(s.id)?'checked':''}><span class="lbl">${esc(s.lbl)}<small>${esc(s.ph)}</small></span><button class="start" data-idx="${idx}">Go ▸</button></div>`;});html+='</div>';});
  html+='</div>';const plan=document.getElementById('plan');const wasOpen=plan.classList.contains('open');plan.innerHTML=html;if(wasOpen)plan.classList.add('open');
  plan.querySelectorAll('.step').forEach(el=>{const id=el.dataset.id;
    el.querySelector('input').onchange=e=>{if(e.target.checked)planDone.add(id);else planDone.delete(id);store.set(PFX+'plan',[...planDone]);el.classList.toggle('done',e.target.checked);
      const dn=STEPS.filter(x=>planDone.has(x.id)).length;document.getElementById('pcount').textContent=dn;document.getElementById('pfill').style.width=Math.round(dn/total*100)+'%';};
    const sb=el.querySelector('.start');if(sb)sb.onclick=()=>{currentStage=+sb.dataset.idx;saveStage();mode='study';studyReset();tActive=false;document.getElementById('plan').classList.remove('open');render();};});}

document.addEventListener('keydown',e=>{if(e.metaKey||e.ctrlKey||e.altKey)return;
  const ae=document.activeElement;if(ae&&/^(input|textarea|select)$/i.test(ae.tagName))return;
  if(tActive&&tReview>=0){
    if(e.key==='ArrowLeft'){e.preventDefault();if(tReview>0){tReview--;renderReview();}return;}

    if(e.key==='Escape'||e.key==='Enter'||e.key===' '){e.preventDefault();exitReview();return;}
    return;}

  if(tActive&&!tPaused&&tAnswered&&tReview<0&&(e.key===' '||e.key==='Enter'||e.key==='ArrowRight')){
    e.preventDefault();if(tNextT){clearTimeout(tNextT);tNextT=null;}next();return;}
  if(tActive&&!tPaused&&(e.key==='p'||e.key==='P'||e.key==='Escape')){e.preventDefault();pauseTest();return;}
  if(tPaused&&(e.key===' '||e.key==='Enter')){e.preventDefault();const b=document.getElementById('pResume');if(b)b.click();return;}
  if(!tActive&&(e.key==='ArrowRight'||e.key==='ArrowLeft')){

  const map={'1':0,'2':1,'3':2,'4':3,a:0,b:1,c:2,d:3},i=map[e.key.toLowerCase()];if(i===undefined)return;

function courseStats(key){const c=ALL.courses[key],p=c.pfx;
  const rev=new Set(store.get(p+'rev',[])),qt=store.get(p+'test',{}),mk=store.get(p+'marks',[]);

function initCourse(key){
  course=key;D=ALL.courses[key];PFX=D.pfx;store.set('fii2_course',key);

  qstreak=store.get(PFX+'qstreak',{});

  tPaused=false;tResumeLeft=0;
  rcStyle=store.get(PFX+'rcstyle','full');rcSel=store.get(PFX+'rcsel',null);rcType='recall';rcRun=false;

  markedOnly=false;seq='a';answers='allhi';expOn=false;clockOn=false;ttsLastKey=null;
  D.questions.forEach(q=>{delete q._sh;delete q._tsh;});
  QID={};D.questions.forEach(q=>{QID[q.id]=q;});
  STEPS=buildSteps();
  STEPS.forEach(st=>{if(st.kind==='read'&&st.ids&&planDone.has('s1_'+st.cat))planDone.add(st.id);});
  const _sid=store.get(PFX+'stageid',null);

body.vlocked .wrap,body.vlocked .home{display:none!important}

<script>
/* Question-bank vault. The #vault element holds AES-GCM ciphertext of {data,figs};
   the key is PBKDF2-SHA256(password). tools/exam-vault.mjs locks/unlocks the file. */
(()=>{
  const KEYSTORE='fb_exam_vault_key';
  const V=document.getElementById('vault');
  const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  const u8b64=u=>{let s='';for(const x of new Uint8Array(u))s+=String.fromCharCode(x);return btoa(s);};
  let KEY=null;const figCache={};
  function boot(){
    const s=document.createElement('script');s.textContent=document.getElementById('appsrc').textContent;
    document.body.appendChild(s);document.body.classList.remove('vlocked');hydrate();}
  if(!V||!V.textContent.trim()){boot();return;}
  const env=JSON.parse(V.textContent);
  document.body.classList.add('vlocked');
  async function derive(pw){
    const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(env.salt),iterations:env.iter,hash:'SHA-256'},
      base,{name:'AES-GCM',length:256},true,['decrypt']);}
  async function open(key){
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(env.iv)},key,b64(env.ct));
    const o=JSON.parse(new TextDecoder().decode(pt));
    document.getElementById('data').textContent=o.data;
    document.getElementById('figs').textContent=o.figs;
    KEY=key;}
  async function decFile(path){
    if(!figCache[path])figCache[path]=fetch(path).then(r=>{if(!r.ok)throw new Error(r.status);return r.arrayBuffer();})
      .then(buf=>crypto.subtle.decrypt({name:'AES-GCM',iv:new Uint8Array(buf,0,12)},KEY,new Uint8Array(buf,12)))
      .then(pt=>URL.createObjectURL(new Blob([pt],{type:'image/webp'})));
    return figCache[path];}
  function hydrate(){
    if(!KEY)return;
    for(const im of document.querySelectorAll('img[data-enc]')){
      const p=im.dataset.enc;im.removeAttribute('data-enc');
      decFile(p).then(u=>{im.src=u;}).catch(e=>console.warn('figure',p,e));}}
  new MutationObserver(hydrate).observe(document.body,{childList:true,subtree:true});
  const lock=document.getElementById('vlock'),form=document.getElementById('vform'),
        pw=document.getElementById('vpw'),err=document.getElementById('verr'),go=document.getElementById('vgo');
  const lb=document.getElementById('lockBtn');
  lb.hidden=false;
  lb.onclick=()=>{try{localStorage.removeItem(KEYSTORE);}catch(e){}location.reload();};
  function ask(){lock.hidden=false;setTimeout(()=>pw.focus(),50);}
  form.addEventListener('submit',async e=>{
    e.preventDefault();err.textContent='';go.disabled=true;go.textContent='Unlocking…';
    try{
      const key=await derive(pw.value);await open(key);
      if(document.getElementById('vrem').checked){
        try{localStorage.setItem(KEYSTORE,JSON.stringify({salt:env.salt,k:u8b64(await crypto.subtle.exportKey('raw',key))}));}catch(e){}}
      lock.hidden=true;pw.value='';boot();
    }catch(x){err.textContent='Wrong password. Try again.';pw.select();}
    go.disabled=false;go.textContent='Unlock';});
  (async()=>{
    let saved=null;try{saved=JSON.parse(localStorage.getItem(KEYSTORE)||'null');}catch(e){}
    if(saved&&saved.salt===env.salt){
      try{const key=await crypto.subtle.importKey('raw',b64(saved.k),'AES-GCM',true,['decrypt']);
        await open(key);boot();return;}
      catch(e){try{localStorage.removeItem(KEYSTORE);}catch(_){}}}
    ask();})();
})();
</script>

<script>
// Flight Bag panels: this page builds its cards from JS on every render, so tag them as .fb-panel
// (grain + edge light + page lamp) whenever the DOM changes and re-place the lamp.
(()=>{const SEL='.card,.tsetup,.hcard,.plan,.sidebar,.notecol';
  const tag=()=>{for(const el of document.querySelectorAll(SEL))if(!el.classList.contains('fb-panel'))el.classList.add('fb-panel');
    if(window.FlightBagTheme)window.FlightBagTheme.place();};
  tag();
  new MutationObserver(tag).observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:['class']});
})();
</script></body></html>
