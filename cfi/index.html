<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="CFI Binder">
<meta name="theme-color" content="#08080a">
<title>CFI Lesson Condenser</title>
<style>
:root {
  --bg0:#08080a; --bg1:#101016; --bg2:#16161e; --bg3:#1e1e2a;
  --text:#d0d0e0; --text2:#999aaa; --text3:#666678; --text4:#444458;
  --blue:#44aaff; --orange:#ffaa00; --lime:#88ff66; --red:#ff5566;
  --bdr:#1a1a24; --btn:#1e1e2a;
  --fs:15px;
  --sidebar-w:260px;
}
* { margin:0; padding:0; box-sizing:border-box; }
html,body { height:100%; overflow:hidden; }
body { background:var(--bg0); color:var(--text); font-family:'SF Pro Display',-apple-system,sans-serif; font-size:var(--fs); }

/* ===== layout ===== */
#app { display:flex; height:100vh; }
nav { width:var(--sidebar-w); min-width:var(--sidebar-w); background:var(--bg1); border-right:1px solid var(--bdr); display:flex; flex-direction:column; }
#main { flex:1; display:flex; flex-direction:column; min-width:0; }
#panes { flex:1; display:flex; min-height:0; }
.pane { flex:1; min-width:0; display:flex; flex-direction:column; border-right:1px solid var(--bdr); }
.pane:last-child { border-right:none; }
.pane-head { padding:8px 14px; background:var(--bg1); border-bottom:1px solid var(--bdr); display:flex; gap:8px; align-items:center; font-size:.8em; color:var(--text2); text-transform:uppercase; letter-spacing:.08em; flex-shrink:0; }
.pane-body { flex:1; overflow-y:auto; padding:14px 18px 40vh 14px; }

/* ===== sidebar ===== */
#nav-head { padding:12px 14px 8px; border-bottom:1px solid var(--bdr); }
#nav-head h1 { font-size:14px; color:var(--blue); letter-spacing:.04em; }
#nav-head .sub { font-size:11px; color:var(--text3); margin-top:2px; }
#search { width:100%; margin-top:8px; background:var(--bg2); border:1px solid var(--bdr); color:var(--text); border-radius:6px; padding:5px 8px; font-size:12px; outline:none; }
#search:focus { border-color:var(--blue); }
#nav-scroll { flex:1; overflow-y:auto; }
#nav-list { padding:6px 0 0; }
.aoe-hdr { padding:7px 14px 4px; font-size:11px; color:var(--orange); text-transform:uppercase; letter-spacing:.06em; cursor:pointer; user-select:none; display:flex; justify-content:space-between; }
.aoe-hdr:hover { color:var(--text); }
.aoe-hdr .tri { color:var(--text4); }
.lesson-item { padding:5px 14px 5px 22px; font-size:12.5px; color:var(--text2); cursor:pointer; border-left:2px solid transparent; display:flex; justify-content:space-between; gap:6px; align-items:center; }
.lesson-item:hover { background:var(--bg2); color:var(--text); }
.lesson-item.active { background:var(--bg2); border-left-color:var(--blue); color:var(--text); }
.lesson-item .cnt { font-size:10px; color:var(--bg0); background:var(--lime); border-radius:8px; padding:0 6px; line-height:15px; font-weight:600; }
.lesson-item .cnt.zero { display:none; }
.lesson-item .toc-tri { color:var(--text4); padding:2px 4px; margin:-2px -4px; flex:0 0 auto; }
.lesson-item .toc-tri:hover { color:var(--text); }

/* ===== header/toolbar ===== */
#toolbar { background:var(--bg1); border-bottom:1px solid var(--bdr); padding:8px 14px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; flex-shrink:0; }
#lesson-title { font-size:15px; font-weight:600; color:var(--text); margin-right:auto; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#lesson-title .refs { display:block; font-size:10.5px; font-weight:400; color:var(--text3); }
.tbtn { background:var(--btn); color:var(--text2); border:1px solid var(--bdr); border-radius:6px; padding:5px 10px; font-size:12px; cursor:pointer; white-space:nowrap; }
.tbtn:hover { color:var(--text); border-color:var(--text4); }
.tbtn.primary { color:var(--bg0); background:var(--blue); border-color:var(--blue); font-weight:600; }
.tbtn.playing { color:var(--bg0); background:var(--lime); border-color:var(--lime); font-weight:600; }
.tctl { display:flex; align-items:center; gap:5px; font-size:11px; color:var(--text3); }
.tctl input[type=range] { width:80px; accent-color:var(--blue); }
select { background:var(--btn); color:var(--text2); border:1px solid var(--bdr); border-radius:6px; padding:4px 6px; font-size:11px; max-width:150px; }

/* ===== content nodes ===== */
.node { position:relative; padding:2px 56px 2px 8px; border-radius:5px; line-height:1.42; }
.node:hover { background:var(--bg1); }
.node.hdr0 { font-weight:700; color:var(--blue); margin-top:14px; font-size:1.05em; }
.node.sect { font-weight:700; color:var(--orange); margin-top:16px; text-transform:uppercase; font-size:.85em; letter-spacing:.06em; }
.node.bold { font-weight:600; }
.node.topic { font-weight:600; color:#7fc9ff; }
.node .bullet { color:var(--text4); margin-right:6px; }
.node .acs { font-size:.68em; color:var(--bg0); background:var(--text4); border-radius:4px; padding:1px 5px; margin-left:7px; vertical-align:middle; white-space:nowrap; }
.node img { max-width:92%; display:block; margin:8px 0; border-radius:8px; border:1px solid var(--bdr); }
.node.tblrow { color:var(--text2); font-size:.92em; }
.node .nbtns { position:absolute; right:2px; top:2px; display:none; gap:2px; }
.node:hover .nbtns { display:flex; }
.nb { width:20px; height:20px; border-radius:5px; border:1px solid var(--bdr); background:var(--bg2); color:var(--text3); font-size:12px; line-height:18px; text-align:center; cursor:pointer; user-select:none; }
.nb:hover { color:var(--text); border-color:var(--text4); }
.nb.add:hover { color:var(--lime); border-color:var(--lime); }
.node.selected { background:rgba(136,255,102,.07); }
.node.selected .nbtns { display:flex; }
.node.selected .nb.add { color:var(--lime); border-color:var(--lime); background:rgba(136,255,102,.12); }
.node.speaking { background:rgba(68,170,255,.14); outline:1px solid rgba(68,170,255,.4); }

/* ===== pane title (which AOE / task you are in) ===== */
.pane-title { margin:0 0 14px; padding-bottom:9px; border-bottom:1px solid var(--bdr); }
.pt-aoe { font-size:.68em; color:var(--orange); text-transform:uppercase; letter-spacing:.11em; font-weight:700; }
.pt-name { font-size:1.12em; font-weight:700; color:var(--text); margin-top:3px; line-height:1.25; }
.pt-refs { font-size:.72em; color:var(--text3); margin-top:3px; }

/* the lesson-plan header reads as columns, like the printed plan — not a
   half-page stack of one-line boxes */
.front-wrap { display:grid; grid-template-columns:repeat(auto-fill, minmax(230px, 1fr)); gap:8px; margin-bottom:12px; align-items:start; }
.front-card { background:var(--bg1); border:1px solid var(--bdr); border-radius:10px; padding:9px 12px; font-size:.86em; break-inside:avoid; }
.front-card.wide { grid-column:1 / -1; }
.front-card .fc-h { color:var(--orange); font-weight:700; font-size:.8em; text-transform:uppercase; letter-spacing:.05em; margin-bottom:4px; }
.front-card div { color:var(--text2); padding:1px 0 1px 11px; position:relative; line-height:1.35; }
.front-card div::before { content:'•'; position:absolute; left:0; color:var(--text4); }
.front-card .fc-h::before, .front-card div.nob::before { content:none; }
.front-card .fc-h { padding-left:0; }
.front-card div.fb { color:var(--text); font-weight:600; }
@media (max-width: 820px) { .front-wrap { grid-template-columns:1fr; } }
.front-toggle { cursor:pointer; color:var(--text3); font-size:11.5px; margin-bottom:10px; user-select:none; }
.front-toggle:hover { color:var(--text); }

/* ===== tabs ===== */
.tabs { display:flex; gap:2px; }
.tab { padding:4px 12px; font-size:11.5px; cursor:pointer; border-radius:6px 6px 0 0; color:var(--text3); background:transparent; border:1px solid transparent; text-transform:none; letter-spacing:0; }
.tab.active { color:var(--text); background:var(--bg2); border-color:var(--bdr); border-bottom-color:var(--bg2); }
.tab:hover { color:var(--text); }
.tab .mcount { color:var(--lime); font-weight:700; }

/* ===== my script ===== */
.ms-item { position:relative; padding:3px 84px 3px 26px; border-radius:5px; line-height:1.48; }
.ms-item.sect { font-weight:700; color:var(--orange); margin-top:22px; margin-bottom:4px; text-transform:uppercase;
                font-size:.85em; letter-spacing:.06em; padding-bottom:4px; border-bottom:1px solid var(--bdr); }
.ms-item.hdr0 { font-weight:700; color:var(--blue); margin-top:16px; margin-bottom:3px; font-size:1.05em; }
.ms-item.topic { font-weight:600; color:#7fc9ff; margin-top:9px; }
.ms-item .bullet { color:var(--text4); margin-right:6px; }
.ms-item.skel-empty { opacity:.32; }
.ms-item:hover { background:var(--bg1); }
.ms-item.note { border-left:2px solid var(--lime); padding-left:10px; }
.ms-item.edited .ms-text::after { content:' \270E'; font-size:.72em; color:var(--lime); }
.ms-item .ms-text[contenteditable] { outline:1px solid var(--blue); border-radius:4px; padding:1px 4px; background:var(--bg2); display:inline-block; min-width:60px; }
.ms-item .mctl { position:absolute; right:2px; top:2px; display:none; gap:2px; }
.ms-item:hover .mctl { display:flex; }
.mb { width:20px; height:20px; border-radius:5px; border:1px solid var(--bdr); background:var(--bg2); color:var(--text3); font-size:11px; line-height:18px; text-align:center; cursor:pointer; user-select:none; }
.mb:hover { color:var(--text); border-color:var(--text4); }
.mb.rm:hover { color:var(--red); border-color:var(--red); }
.mb.nadd:hover, .mb.reset:hover { color:var(--lime); border-color:var(--lime); }
#ms-addline { margin:16px 0 0 26px; }

/* ===== flashcards ===== */
#card-tools { display:flex; gap:6px; align-items:center; margin-bottom:12px; flex-wrap:wrap; }
#card-tools .hint { font-size:11px; color:var(--text4); margin-left:auto; }
#card-stage { max-width:560px; margin:0 auto; }
#fcard { min-height:280px; background:var(--bg1); border:1px solid var(--bdr); border-radius:16px;
         padding:26px 24px; cursor:pointer; display:flex; flex-direction:column; justify-content:center;
         box-shadow:0 8px 30px rgba(0,0,0,.35); user-select:none; }
#fcard:hover { border-color:var(--text4); }
#fcard .fc-kicker { font-size:.68em; color:var(--orange); text-transform:uppercase; letter-spacing:.1em; margin-bottom:12px; text-align:center; }
#fcard .fc-front { font-size:1.35em; font-weight:700; color:var(--blue); text-align:center; line-height:1.3; }
#fcard .fc-hint { margin-top:18px; font-size:.72em; color:var(--text4); text-align:center; }
#fcard .fc-back { font-size:.98em; line-height:1.5; }
#fcard .fc-back .bk { padding:3px 0 3px 0; color:var(--text); }
#fcard .fc-back .bk.sub { padding-left:20px; color:var(--text2); font-size:.94em; }
#fcard .fc-back .bk.act { color:var(--lime); font-weight:600; }
#fcard .fc-back .bk b { color:#7fc9ff; }
#card-actions { display:flex; gap:10px; margin-top:14px; }
#card-actions button { flex:1; padding:13px; font-size:14px; border-radius:10px; border:1px solid var(--bdr);
                       background:var(--bg2); cursor:pointer; font-family:inherit; font-weight:600; }
#btn-again { color:var(--red); }
#btn-again:hover, #btn-again:active { border-color:var(--red); background:#1c0d10; }
#btn-got { color:var(--lime); }
#btn-got:hover, #btn-got:active { border-color:var(--lime); background:#0d1a08; }
#card-progress { text-align:center; font-size:12px; color:var(--text3); margin-top:12px; }
#card-progress .known { color:var(--lime); }
.cards-done { text-align:center; padding:50px 20px; color:var(--text2); }
.cards-done .big { font-size:2.2em; margin-bottom:12px; }

/* ===== flow (topic sequence) ===== */
#flow-tools { display:flex; gap:6px; align-items:center; margin-bottom:12px; flex-wrap:wrap; }
#flow-tools .hint { font-size:11px; color:var(--text4); }
.flow-sect { color:var(--orange); font-weight:700; font-size:.8em; text-transform:uppercase; letter-spacing:.06em; margin:16px 0 5px; }
.flow-sect:first-child { margin-top:0; }
.flow-item { display:flex; gap:9px; align-items:baseline; padding:3px 6px; border-radius:5px; cursor:pointer; line-height:1.35; }
.flow-item:hover { background:var(--bg1); }
.flow-num { color:var(--text4); font-size:.8em; min-width:20px; text-align:right; flex-shrink:0; font-variant-numeric:tabular-nums; }
.flow-text { color:#7fc9ff; font-weight:600; }
.flow-item.sub .flow-text { color:var(--text2); font-weight:400; font-size:.94em; }
.flow-item.d2 { margin-left:26px; padding-top:2px; padding-bottom:2px; }
.flow-item.d2 .flow-text { color:#7fc9ff; font-weight:600; font-size:.93em; }
.flow-item.d3 { margin-left:44px; padding-top:1px; padding-bottom:1px; }
.flow-item.d3 .flow-num { color:var(--text4); }
.flow-item.d3 .flow-text { color:var(--text2); font-weight:400; font-size:.9em; }
.flow-item.masked .flow-text { background:var(--bg3); color:transparent; border-radius:4px; user-select:none; }
.flow-item.masked:hover .flow-text { background:var(--bg2); }
.flow-item .flow-acs { font-size:.66em; color:var(--bg0); background:var(--text4); border-radius:4px; padding:1px 5px; }
.flow-item.masked .flow-acs { visibility:hidden; }
.ms-src { margin:14px 0 4px; font-size:.75em; color:var(--text4); text-transform:uppercase; letter-spacing:.08em; }
.empty-hint { color:var(--text4); font-size:.9em; padding:30px 20px; text-align:center; line-height:1.6; }
kbd { background:var(--bg3); border:1px solid var(--text4); border-radius:4px; padding:0 5px; font-size:.85em; font-family:inherit; }

/* ===== nav: in-lesson table of contents ===== */
.toc-item { padding:3px 12px 3px 34px; font-size:11.5px; color:var(--text3); cursor:pointer;
            border-left:2px solid var(--bdr); margin-left:12px; line-height:1.3; }
.toc-item:hover { color:var(--text); background:var(--bg2); border-left-color:var(--blue); }
.toc-item.sect { color:var(--orange); text-transform:uppercase; font-size:10px; letter-spacing:.05em; margin-top:4px; }
.toc-item.deep { padding-left:46px; color:var(--text4); font-size:11px; }
.toc-item.deep:hover { color:var(--text2); }
.toc-item.here { color:#ffd24a; border-left-color:#ffd24a; background:rgba(255,210,74,.07); font-weight:600; }
.toc-item.here.sect { color:#ffd24a; }

/* ===== nav: library (documents · videos · links) ===== */
/* library lives in the main sidebar scroll, one divider per section;
   only Settings stays pinned at the bottom */
#nav-library { border-top:1px solid var(--bdr); margin-top:8px; padding-bottom:30px; }
#nav-library .lib-hdr:not(:first-child) { border-top:1px solid var(--bdr); margin-top:6px; padding-top:9px; }
.lib-hdr { padding:8px 14px 5px; font-size:11px; color:var(--lime); text-transform:uppercase;
           letter-spacing:.06em; cursor:pointer; user-select:none; display:flex; justify-content:space-between; }
.lib-hdr:hover { color:var(--text); }
.lib-hdr .tri { color:var(--text4); }
.lib-item { padding:5px 12px 5px 20px; font-size:11.5px; color:var(--text2); cursor:pointer;
            display:flex; gap:7px; align-items:baseline; line-height:1.3; }
.lib-item:hover { background:var(--bg2); color:var(--text); }
.lib-item .code { color:var(--orange); font-size:9.5px; min-width:34px; flex-shrink:0; font-variant-numeric:tabular-nums; }
.lib-item .dsize { color:var(--text4); font-size:9px; flex-shrink:0; }
.lib-item .lbl { flex:1; overflow:hidden; text-overflow:ellipsis; }
.lib-sub { padding:6px 14px 2px 20px; font-size:10px; color:var(--text4); text-transform:uppercase; letter-spacing:.05em; }

/* ===== media viewer ===== */
#media-body .mv-head { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
#media-body .mv-title { font-size:1.05em; font-weight:700; color:var(--text); flex:1; }
#media-body .mv-frame { width:100%; aspect-ratio:16/9; border:1px solid var(--bdr); border-radius:10px; background:#000; }
#media-body .mv-frame.doc { aspect-ratio:auto; height:78vh; background:var(--bg1); }
#media-body .mv-meta { margin-top:10px; font-size:12px; color:var(--text3); }
#media-body .mv-meta a { color:var(--orange); }

/* ===== nav settings block ===== */
#nav-settings { border-top:1px solid var(--bdr); padding:10px 14px 12px; display:flex; flex-direction:column; gap:6px; flex-shrink:0; }
#nav-settings .ns-label { font-size:10px; color:var(--text4); text-transform:uppercase; letter-spacing:.09em;
                          margin-bottom:2px; cursor:pointer; user-select:none; display:flex; justify-content:space-between; }
#nav-settings .ns-label:hover { color:var(--text2); }
#ns-body { display:flex; flex-direction:column; gap:6px; }
#nav-settings.collapsed #ns-body { display:none; }
#nav-settings .tbtn { text-align:left; }
#nav-settings .tctl { justify-content:space-between; }
#offline-state { font-size:10.5px; color:var(--text4); line-height:1.35; }
#offline-state.ready { color:var(--lime); }
#offline-state.working { color:var(--orange); }
#nav-settings .tctl input[type=range] { flex:1; margin-left:8px; }

/* ===== toolbar toggles & read mode ===== */
.tbtn.on { color:var(--bg0); background:var(--blue); border-color:var(--blue); font-weight:600; }
#read-ctl { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
body:not(.readmode) #read-ctl { display:none; }
body:not(.readmode) .nb.play, body:not(.readmode) .mb.play { display:none !important; }
/* clean teaching page: no edit / add / remove chrome hanging off every line */
body.noedit .mb.edit, body.noedit .mb.nadd, body.noedit .mb.rm,
body.noedit .mb.reset, body.noedit .nb.add, body.noedit #ms-addline { display:none !important; }
body.noedit .ms-item { padding-right:30px; }
body.noedit .node { padding-right:30px; }

/* ===== split / focus ===== */
body.nosplit #pane-ext { display:none; }
@media (max-width: 820px) { #tgl-split { display:none; } }

/* ===== sync ===== */
#sync-state { font-size:10.5px; color:var(--text4); }
#sync-state.ok { color:var(--lime); }
#sync-state.err { color:var(--orange); }

/* ===== pdf viewer ===== */
#pv-stage { border:1px solid var(--bdr); border-radius:10px; background:#26262e; overflow:auto;
            max-height:calc(100vh - 130px); text-align:center; position:relative; }
#pv-canvas { display:inline-block; margin:8px 0; background:#fff; box-shadow:0 4px 18px rgba(0,0,0,.5); }
#pv-msg { position:absolute; top:16px; left:0; right:0; color:var(--text3); font-size:13px; }
#pv-scrub { margin:2px 0 8px; }
#pv-slider { width:100%; accent-color:var(--blue); cursor:pointer; }
#pv-toc { display:none; border:1px solid var(--bdr); border-radius:10px; background:var(--bg1);
          max-height:42vh; overflow-y:auto; margin-bottom:8px; padding:6px 0; }
.pv-toc-item { padding:7px 14px; font-size:12.5px; color:var(--text2); cursor:pointer;
               display:flex; justify-content:space-between; gap:10px; }
.pv-toc-item:hover { background:var(--bg2); color:var(--text); }
.pv-toc-item .pg { color:var(--text4); font-size:11px; flex-shrink:0; }
.pv-toc-item.d1 { padding-left:28px; font-size:12px; color:var(--text3); }
.pv-toc-item.d2 { padding-left:42px; font-size:11.5px; color:var(--text4); }
#pv-page { width:56px; background:var(--bg2); border:1px solid var(--bdr); color:var(--text);
           border-radius:6px; padding:4px 6px; font-size:12px; text-align:center; }
.pv-total { color:var(--text4); font-size:12px; }

/* ===== school standards card ===== */
.school-card { background:var(--bg1); border:1px solid rgba(136,255,102,.25); border-radius:10px;
               padding:10px 14px; margin:0 0 12px; font-size:.88em; }
.sc-head { display:flex; align-items:center; gap:8px; margin-bottom:6px; }
.sc-tag { background:var(--lime); color:var(--bg0); font-weight:700; font-size:.68em; border-radius:4px; padding:1px 6px; }
.sc-title { color:var(--text); font-weight:600; flex:1; font-size:.92em; }
.sc-var { color:var(--lime); font-weight:600; font-size:.82em; margin:7px 0 2px; }
.sc-grid { display:grid; grid-template-columns:auto 1fr; gap:2px 14px; margin:4px 0; }
.sc-grid.two { grid-template-columns:auto 1fr 1fr; }
.sc-k { color:var(--text3); font-size:.85em; }
.sc-lbl { color:var(--text4); font-size:.72em; text-transform:uppercase; letter-spacing:.05em; }
.sc-v { color:var(--text); font-variant-numeric:tabular-nums; }
.sc-note { color:var(--text2); font-size:.85em; padding:1px 0 1px 4px; }

/* ===== inline handbook button on a heading ===== */
.draw-chip { display:inline-block; margin-left:8px; padding:1px 7px; border-radius:5px; font-size:9.5px;
             font-weight:700; letter-spacing:.06em; color:var(--lime); border:1px solid var(--lime);
             opacity:.85; vertical-align:1px; white-space:nowrap; }
.inline-ref { display:inline-block; margin-left:8px; padding:1px 7px; border-radius:5px; cursor:pointer;
              font-size:.62em; font-weight:700; letter-spacing:.04em; vertical-align:middle;
              color:var(--orange); border:1px solid rgba(255,170,0,.35); background:rgba(255,170,0,.07);
              text-transform:none; white-space:nowrap; }
.inline-ref:hover { color:var(--bg0); background:var(--orange); border-color:var(--orange); }
body.noedit .inline-ref { opacity:.85; }

/* ===== handbook deep links ===== */
.ref-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(250px, 1fr)); gap:6px; margin:2px 0 6px 26px; }
.ref-chip { background:var(--bg1); border:1px solid var(--bdr); border-radius:8px; padding:7px 10px;
            cursor:pointer; display:flex; flex-direction:column; gap:1px; }
.ref-chip:hover { border-color:var(--orange); background:var(--bg2); }
.rc-book { font-size:.82em; color:var(--text); font-weight:600; }
.rc-ch { font-size:.78em; color:var(--text3); }
.rc-go { font-size:.72em; color:var(--orange); }

/* ===== reference links ===== */
a.reflink { color:var(--orange); text-decoration:none; border-bottom:1px dotted currentColor; }
a.reflink:hover { color:#ffc84d; border-bottom-style:solid; }
.ms-link { padding:3px 0 3px 26px; font-size:.92em; }
.ms-link a.reflink { border-bottom:none; }
.ms-link a.reflink::before { content:'🔗 '; font-size:.85em; }

/* ===== my-script images & figures ===== */
.ms-item img { max-width:92%; display:block; margin:8px 0; border-radius:8px; border:1px solid var(--bdr); }
.ms-figs img { max-width:92%; display:block; margin:10px 0; border-radius:8px; border:1px solid var(--bdr); }

/* ===== password gate ===== */
#gate { position:fixed; inset:0; z-index:200; background:var(--bg0); display:flex; align-items:center; justify-content:center; padding:24px; }
#gate.hidden { display:none; }
#gate-box { width:100%; max-width:320px; text-align:center; }
#gate-box h1 { font-size:15px; color:var(--blue); letter-spacing:.09em; margin-bottom:6px; }
#gate-box p { font-size:12px; color:var(--text3); margin-bottom:16px; }
#gate-pw { width:100%; background:var(--bg2); border:1px solid var(--bdr); color:var(--text); border-radius:8px;
           padding:11px 12px; font-size:16px; outline:none; margin-bottom:9px; font-family:inherit; }
#gate-pw:focus { border-color:var(--blue); }
#gate-go { width:100%; padding:11px; font-size:14px; }
#gate-err { color:var(--red); font-size:12px; margin-top:10px; visibility:hidden; }
#gate-err.show { visibility:visible; }

/* ===== mobile ===== */
#menu-btn, #pane-switch { display:none; }
@media (max-width: 820px) {
  html, body { overflow:hidden; }
  nav { position:fixed; top:0; bottom:0; left:0; z-index:120; transform:translateX(-100%);
        transition:transform .22s ease; box-shadow:0 0 30px rgba(0,0,0,.6); width:82vw; min-width:0; max-width:320px; }
  nav.open { transform:none; }
  #nav-scrim { position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:110; display:none; }
  #nav-scrim.show { display:block; }
  #menu-btn { display:inline-block; order:-2; padding:4px 9px; }
  #toolbar { gap:6px; padding:6px 9px; row-gap:5px; }
  /* the pane title block already names the lesson — no need to repeat it up here */
  #lesson-title { display:none; }
  #btn-stop { display:none; }
  #toolbar .tbtn { padding:4px 9px; font-size:11.5px; }
  #toolbar .tctl { font-size:10px; }
  #toolbar .tctl input[type=range] { width:64px; }
  #toolbar select { font-size:10.5px; max-width:104px; padding:3px 4px; }
  #pane-switch { display:flex; gap:2px; width:100%; order:10; }
  #pane-switch button { flex:1; padding:6px; font-size:12px; background:var(--btn); color:var(--text3);
                        border:1px solid var(--bdr); border-radius:6px; cursor:pointer; font-family:inherit; }
  .pane-head { padding:6px 10px; }
  .tab { padding:4px 9px; font-size:11px; }
  #pane-switch button.on { background:var(--bg2); color:var(--text); border-color:var(--blue); }
  .pane { display:none; border-right:none; }
  .pane.show-sm { display:flex; }
  .pane-body { padding:12px 12px 45vh 10px; }
  .node img { max-width:100%; }
  .ms-item { padding-right:70px; }
  /* no hover on touch — action buttons must always be reachable */
  .node .nbtns, .ms-item .mctl { display:flex; }
  .node { padding-right:60px; }
  .nb, .mb { width:24px; height:24px; line-height:22px; }
  .flow-item { padding:6px; }
}
@media (hover: none) {
  .node .nbtns, .ms-item .mctl { display:flex; }
}

/* ===== quick-action dock (styled after the W&B calculator's floating bar) ===== */
#dock { display:none; }
@media (max-width: 820px), (pointer: coarse) {
  #dock { display:flex; position:fixed; left:12px; right:12px;
    bottom:calc(12px + env(safe-area-inset-bottom, 0px)); z-index:105; gap:8px; padding:7px;
    background:rgba(16,16,22,.92); /* --bg1 at 92% for the blur */
    border:1px solid var(--bdr); border-radius:14px;
    box-shadow:0 8px 32px rgba(0,0,0,.45); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    opacity:0; transform:translateY(130%); transition:opacity .25s, transform .25s; pointer-events:none; }
  #dock.show { opacity:1; transform:none; pointer-events:auto; }
  .dock-btn { flex:1; padding:11px 8px; font-size:13px; font-family:inherit; background:var(--btn);
    color:var(--text2); border:1px solid var(--bdr); border-radius:10px; cursor:pointer; }
  .dock-btn:active { background:var(--bg2); color:var(--text); border-color:var(--blue); }
  .dock-btn:disabled { opacity:.35; }
  #dock-menu { flex:0 0 56px; font-size:16px; }
  #dock-prev { text-align:left; padding-left:16px; }
  #dock-next { text-align:right; padding-right:16px; }
}

::-webkit-scrollbar { width:9px; }
::-webkit-scrollbar-thumb { background:var(--bg3); border-radius:5px; }
::-webkit-scrollbar-track { background:transparent; }
#toast { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:var(--bg3); color:var(--text); border:1px solid var(--text4); padding:8px 18px; border-radius:8px; font-size:13px; opacity:0; transition:opacity .25s; pointer-events:none; z-index:99; }
#toast.show { opacity:1; }

<script>
const D = window.CFI_DATA;
const $ = s => document.querySelector(s);
const LS_KEY = 'cfi-condenser-v1';

let store = { sel: {}, prefs: { rate: 1.4, voice: '', fs: 15 }, last: null };
try { const raw = localStorage.getItem(LS_KEY); if (raw) store = Object.assign(store, JSON.parse(raw)); } catch(e) {}
function save() {
  if (curKey && !applyingRemote) (store.selTs = store.selTs || {})[curKey] = Date.now();
  localStorage.setItem(LS_KEY, JSON.stringify(store));
  if (typeof schedulePush === 'function' && !applyingRemote) schedulePush();
}

let cur = null;        // {aoe, lesson}
let curKey = null;     // selection key
let tocOpen = false;   // the open lesson's topic list in the sidebar (arrow-toggled)
let openAoes = new Set(D.aoes.map(a => a.num));

/* ---------- sidebar ---------- */
function selCount(key) {
  const s = store.sel[key];
  return s ? (s.x ? s.x.length : 0) + (s.c ? s.c.length : 0) : 0;
}
function renderNav(filter) {
  const list = $('#nav-list');
  list.innerHTML = '';
  const f = (filter || '').toLowerCase();
  D.aoes.forEach(aoe => {
    const lessons = aoe.lessons.filter(l => !f || l.title.toLowerCase().includes(f) || aoe.name.toLowerCase().includes(f));
    if (!lessons.length) return;
    const hdr = document.createElement('div');
    hdr.className = 'aoe-hdr';
    const open = f ? true : openAoes.has(aoe.num);
    hdr.innerHTML = `<span>${aoe.num}. ${aoe.name}</span><span class="tri">${open ? '▾' : '▸'}</span>`;
    hdr.onclick = () => { openAoes.has(aoe.num) ? openAoes.delete(aoe.num) : openAoes.add(aoe.num); renderNav($('#search').value); };
    list.appendChild(hdr);
    if (!open) return;
    lessons.forEach(l => {
      const it = document.createElement('div');
      it.className = 'lesson-item' + (cur && cur.lesson === l ? ' active' : '');
      // badge only when this lesson carries your own picks or notes — every
      // lesson has a script now, so a "scripted" marker would just be noise
      const n = selCount(l.id);
      const hereOpen = cur && cur.lesson === l && tocOpen;
      it.innerHTML = `<span>${l.title.replace(/^[IVXLC]+\.[A-Z](-[A-Z])?\.\s*/, m => m)}</span><span class="cnt${n ? '' : ' zero'}">${n}</span><span class="toc-tri">${hereOpen ? '▾' : '▸'}</span>`;
      // name = navigate only (fast cycling); the arrow owns expand/collapse
      it.onclick = () => {
        if (cur && cur.lesson === l) return;
        tocOpen = false;
        loadLesson(aoe, l);
        if (isMobile()) openNav(false);
      };
      it.querySelector('.toc-tri').onclick = e => {
        e.stopPropagation();
        if (cur && cur.lesson === l) {
          tocOpen = !tocOpen;
          renderNav($('#search').value);
        } else {
          tocOpen = true;                              // open a new lesson with its topics showing
          loadLesson(aoe, l);                          // keep the sidebar up so the topics are visible
        }
      };
      list.appendChild(it);
      if (cur && cur.lesson === l && tocOpen) renderToc(list);   // expand the open lesson's topics
    });
  });
}
$('#search').addEventListener('input', e => renderNav(e.target.value));

/* ---------- in-lesson table of contents ----------
   Outlines whichever pane is actually on screen, so the jump lands where the
   user is reading. */
function activeOutline() {
  if (!cur) return null;
  if ($('#mine-body').style.display !== 'none' && lessonScript())
    return { nodes: lessonScript().nodes, src: 'p' };
  if ($('#con-body').style.display !== 'none' && cur.lesson.con)
    return { nodes: cur.lesson.con.nodes, src: 'c' };
  if (!splitView && cur.lesson.con) return { nodes: cur.lesson.con.nodes, src: 'c' };
  const onLp = document.querySelector('.tab[data-ltab="lp"]').classList.contains('active');
  if (onLp && cur.lesson.con) return { nodes: cur.lesson.con.nodes, src: 'c' };
  if (cur.lesson.ext) return { nodes: cur.lesson.ext.nodes, src: 'x' };
  return cur.lesson.con ? { nodes: cur.lesson.con.nodes, src: 'c' } : null;
}
function renderToc(container) {
  const o = activeOutline();
  if (!o) return;
  // same topic filter the Flow tab uses — headings and ACS elements, not prose
  flowTopics(o.nodes, false).forEach(t => {
    if (/^(attention|overview|what|why|introduction)$/i.test(t.t.trim())) return;
    const d = document.createElement('div');
    d.className = 'toc-item' + (t.kind === 'sect' ? ' sect' : (t.kind === 'sub' ? ' deep' : ''));
    const label = shortCue(t.t);
    d.textContent = label.length > 42 ? label.slice(0, 40).trim() + '…' : label;
    d.title = t.t;
    d.dataset.nodeIdx = t.i;
    d.dataset.src = o.src;
    d.onclick = e => { e.stopPropagation(); jumpToNode(o.src, t.i); if (isMobile()) openNav(false); };
    container.appendChild(d);
  });
  requestAnimationFrame(syncTocHighlight);
}

/* ---------- scroll-spy: light up where you are ---------- */
function visiblePaneBody() {
  for (const s of ['#mine-body', '#con-body', '#flow-body', '#lp-body', '#ext-body']) {
    const el = $(s);
    if (el && el.style.display !== 'none' && el.offsetParent) return el;
  }
  return null;
}
function syncTocHighlight() {
  const toc = [...document.querySelectorAll('.toc-item')];
  if (!toc.length) return;
  const body = visiblePaneBody();
  if (!body) return;
  const src = toc[0].dataset.src;
  const sel = src === 'p' ? '#mine-body .ms-item' : (src === 'x' ? '#ext-body .node' : null);
  let rows;
  if (sel) rows = [...document.querySelectorAll(sel)];
  else rows = [...body.querySelectorAll('.ms-item, .node')];
  if (!rows.length) return;

  // the topic whose line is highest in the upper quarter of the viewport
  const top = body.getBoundingClientRect().top;
  const cutoff = top + body.clientHeight * 0.25;
  let curIdx = -1;
  toc.forEach(t => {
    const i = +t.dataset.nodeIdx;
    const row = rows[i];
    if (!row) return;
    if (row.getBoundingClientRect().top <= cutoff) curIdx = i;
  });
  toc.forEach(t => t.classList.toggle('here', +t.dataset.nodeIdx === curIdx));
  const active = toc.find(t => t.classList.contains('here'));
  if (active) {
    const nav = $('#nav-list');
    const r = active.getBoundingClientRect(), nr = nav.getBoundingClientRect();
    if (r.top < nr.top + 8 || r.bottom > nr.bottom - 8)
      active.scrollIntoView({ block: 'center' });
  }
}
let spyTick = false;
function onPaneScroll() {
  if (spyTick) return;
  spyTick = true;
  requestAnimationFrame(() => { spyTick = false; syncTocHighlight(); showDock(); });
}
['#mine-body', '#con-body', '#flow-body', '#lp-body', '#ext-body'].forEach(s => {
  const el = document.querySelector(s);
  if (el) el.addEventListener('scroll', onPaneScroll, { passive: true });
});

/* ---------- library: documents · videos · links ---------- */
const KIND_TAG = { mine: 'MINE', school: 'USAA', acs: 'ACS', handbook: 'BOOK', ac: 'AC' };
const DOCS = (window.CFI_DOCS || []).map(d =>
  ({ title: d.title, url: d.url, code: KIND_TAG[d.kind] || 'DOC', mb: d.mb }));
let libOpen = { docs: true, videos: true, links: false };

function lessonCode(title) {
  const m = title.match(/^([IVXLC]+\.[A-Z](?:-[A-Z])?)/);
  return m ? m[1] : title.slice(0, 5);
}
function buildLibrary() {
  const byUrl = new Map();
  CFI_DATA.aoes.forEach(a => a.lessons.forEach(l => {
    const src = l.con || l.ext;
    if (!src || !src.links) return;
    const code = lessonCode(l.title);
    src.links.forEach(([anchor, url]) => {
      if (!byUrl.has(url)) byUrl.set(url, { anchor, codes: new Set(), url });
      byUrl.get(url).codes.add(code);
      if (anchor.length > byUrl.get(url).anchor.length) byUrl.get(url).anchor = anchor;
    });
  }));
  const all = [...byUrl.values()];
  const isVid = u => /youtube\.com|youtu\.be|vimeo\.com/.test(u);
  return {
    videos: all.filter(x => isVid(x.url)),
    links: all.filter(x => !isVid(x.url)).sort((a, b) =>
      [...a.codes][0].localeCompare([...b.codes][0]) || a.anchor.localeCompare(b.anchor)),
  };
}
let LIB = null;
function renderLibrary() {
  if (!LIB) LIB = buildLibrary();
  const c = $('#nav-library'); c.innerHTML = '';
  const section = (key, label, count, items, render) => {
    const h = document.createElement('div');
    h.className = 'lib-hdr';
    h.innerHTML = `<span>${label} <span style="color:var(--text4)">${count}</span></span><span class="tri">${libOpen[key] ? '▾' : '▸'}</span>`;
    h.onclick = () => { libOpen[key] = !libOpen[key]; renderLibrary(); };
    c.appendChild(h);
    if (libOpen[key]) items.forEach(render);
  };

  section('videos', 'Videos', LIB.videos.length, LIB.videos, v => {
    const el = document.createElement('div');
    el.className = 'lib-item';
    el.innerHTML = `<span class="code">${[...v.codes].sort().join(',')}</span>` +
                   `<span class="lbl">▶ ${escapeHtml(v.anchor)}</span>`;
    el.onclick = () => openMedia({ type: 'video', url: v.url, title: v.anchor, code: [...v.codes].sort().join(', ') });
    c.appendChild(el);
  });

  section('links', 'Links', LIB.links.length, LIB.links, l => {
    const el = document.createElement('div');
    el.className = 'lib-item';
    el.innerHTML = `<span class="code">${[...l.codes].sort().join(',')}</span>` +
                   `<span class="lbl">${escapeHtml(l.anchor)}</span>`;
    el.onclick = () => window.open(l.url, '_blank', 'noopener');
    c.appendChild(el);
  });

  section('docs', 'Documents', DOCS.length, DOCS, d => {
    const el = document.createElement('div');
    el.className = 'lib-item';
    el.innerHTML = `<span class="code">${d.code}</span><span class="lbl">${escapeHtml(d.title)}</span>` +
                   (d.mb ? `<span class="dsize">${d.mb >= 1 ? d.mb + 'M' : ''}</span>` : '');
    el.onclick = () => openMedia({ type: 'doc', url: d.url, title: d.title });
    c.appendChild(el);
  });
}

/* ---------- media viewer (in-page video / PDF) ---------- */
function ytEmbed(url) {
  const m = url.match(/(?:v=|youtu\.be\/|embed\/)([\w-]{6,})/);
  const t = (url.match(/[?&]t=(\d+)/) || [])[1];
  return m ? `https://www.youtube.com/embed/${m[1]}?rel=0${t ? '&start=' + t : ''}` : null;
}
function openMedia({ type, url, title, code }) {
  if (type === 'doc') {
    if (window.pdfjsLib) { openPdfViewer(url, title); return; }
    window.open(url, '_blank', 'noopener'); return;   // fallback
  }
  stopReading();
  ['#con-body', '#mine-body', '#flow-body', '#cards-body'].forEach(s => $(s).style.display = 'none');
  document.querySelectorAll('.tab[data-tab]').forEach(x => x.classList.remove('active'));
  if (isMobile()) showPane('right');
  const mb = $('#media-body'); mb.style.display = ''; mb.innerHTML = '';

  const head = document.createElement('div');
  head.className = 'mv-head';

/* ---------- selections ---------- */
function getSel() {

  const s = store.sel[curKey];
  if (!s.x) s.x = [];
  if (!s.c) s.c = [];

  if (!s.notes) s.notes = []; // custom lines: {a: anchorKey|'end', l: indent, t: text}
  if (!s.pr) s.pr = [];      // indices removed from a pre-written script

}
function lessonScript() {
  const sc = window.CFI_SCRIPTS && cur && window.CFI_SCRIPTS[cur.lesson.id];
  if (sc && !sc._marked) {
    sc.nodes = splitBulletRuns(sc.nodes);

/* Anchor lesson-plan images into the authored script at the matching spot,
   preserving lesson-plan order. Each image's anchor text is its own line (or
   the nearest bold heading above it); that text is fuzzy-matched against the
   script lines. Unmatchable images fall through to a gallery at the end. */
function simTokens(s) {
  return new Set(s.toLowerCase().replace(/[^a-z0-9 ]+/g, ' ').split(/\s+/)
    .filter(w => w.length > 2 && !/^(the|and|for|are|that|this|with|from|when|your|will)$/.test(w)));
}
function dice(a, b) {
  if (!a.size || !b.size) return 0;
  let hit = 0;
  a.forEach(w => { if (b.has(w)) hit++; });
  return (2 * hit) / (a.size + b.size);
}
/* A figure belongs AFTER the topic it illustrates — never inside a list, and
   never between the letters of an acronym. Find the block that owns the
   matched line and return that block's LAST node, so the image renders once
   the topic has been fully said. */
function isHeadingNode(n) { return n.l === -1 || (n.b && (n.l <= 1 || n.k)); }
function isAcronymLetter(t) { return /^[A-Z0-9]{1,3}\s*[—–-]\s+\S/.test(t); }

function blockTailFor(nodes, idx, floor, ceil) {
  // 1. the heading that owns the matched line
  let h = idx;
  if (!isHeadingNode(nodes[idx])) {
    const lvl = Math.max(0, nodes[idx].l);
    for (let j = idx - 1; j >= 0; j--) {
      if (nodes[j].l === -1 || (isHeadingNode(nodes[j]) && Math.max(0, nodes[j].l) < lvl)) { h = j; break; }
    }
  }
  // 2. if that heading is one letter of an acronym (C — Cognitive…), the real
  //    unit is the parent group — keep the letters together
  if (nodes[h].l === 1 && isAcronymLetter(nodes[h].t)) {
    for (let j = h - 1; j >= 0; j--) {
      if (nodes[j].l === -1 || (nodes[j].b && nodes[j].l === 0)) { h = j; break; }
    }
  }
  // 3. walk to the end of that block — the line before the next heading of the
  //    same or higher rank
  const rank = nodes[h].l === -1 ? -1 : Math.max(0, nodes[h].l);
  let end = h;
  for (let j = h + 1; j <= ceil; j++) {
    const n = nodes[j];
    const nr = n.l === -1 ? -1 : Math.max(0, n.l);
    if (isHeadingNode(n) && nr <= rank) break;
    end = j;
  }
  return Math.min(ceil, Math.max(end, floor));
}
function mapScriptImages(sc, con) {
  sc._leftoverImgs = [];
  if (!con) return;
  const scTok = sc.nodes.map(n => simTokens(n.t));
  // hand-placed figures win; everything they claim is skipped by the fuzzy pass
  const pinned = new Set();
  const overrides = (window.CFI_FIGS || {})[cur ? cur.lesson.id : ''];
  if (overrides) {
    Object.entries(overrides).forEach(([heading, imgs]) => {
      const at = sc.nodes.findIndex(n => n.t === heading);
      if (at < 0) return;                       // heading reworded — leave to the mapper
      imgs.forEach(p => pinned.add(p));
      sc.nodes[at].img = (sc.nodes[at].img || []).concat(imgs);
    });
  }
  // front-matter images (rare) belong at the very top — first section line
  (con.front || []).forEach(cell => cell.forEach(ln => {
    if (ln.img) { (sc.nodes[0].img = sc.nodes[0].img || []).push(ln.img); }
  }));
  // Walk the figures in lesson-plan order and, for each, pick the best-matching
  // script line AT OR AFTER the previous figure's line. Searching a shrinking
  // window keeps figures in source order without shoving mismatches onto one
  // line (which is what a plain "clamp forward" did).
  // Figures belong in the teaching body, never in the Introduction boilerplate.
  const howIdx = sc.nodes.findIndex(n => /^How:?$/i.test(n.t));
  const concIdx = sc.nodes.findIndex(n => /^Conclusion$/i.test(n.t));
  const bodyStart = howIdx >= 0 ? howIdx + 1 : 0;
  const bodyEnd = concIdx > bodyStart ? concIdx - 1 : sc.nodes.length - 1;

  let lastAnchor = bodyStart;
  const load = {};   // how many figures already sit on a line
  con.nodes.forEach((n, i) => {
    if (!n.img) return;
    const imgs = n.img.filter(p => !pinned.has(p));   // hand-placed above
    if (!imgs.length) return;
    let at = (n.b || n.l <= 1) && n.t ? n.t : '';
    if (!at) for (let j = i; j >= 0 && !at; j--) if (con.nodes[j].b && con.nodes[j].t) at = con.nodes[j].t;
    const tok = simTokens(at || n.t || '');
    let best = -1, score = 0;
    for (let k = lastAnchor; k < scTok.length; k++) {
      let s = dice(tok, scTok[k]);
      if (sc.nodes[k].b) s *= 1.15;            // headings are the natural home for a figure
      if ((load[k] || 0) >= 2) s *= 0.5;       // stop piling figures on one line
      if (s > score) { score = s; best = k; }
    }
    if (best < 0 || score < 0.3) {
      // No wording match (the script condensed that section away). Fall back to
      // the figure's RELATIVE position in the lesson plan so it still lands in
      // roughly the right place inline, rather than being dumped at the end.
      const frac = i / Math.max(1, con.nodes.length - 1);
      const prop = bodyStart + Math.round(frac * Math.max(0, bodyEnd - bodyStart));
      best = Math.min(bodyEnd, Math.max(lastAnchor, prop));
      while (best < bodyEnd && (load[best] || 0) >= 2) best++;   // don't stack
    }
    best = blockTailFor(sc.nodes, best, bodyStart, bodyEnd);   // sit after the topic, never inside it
    (sc.nodes[best].img = sc.nodes[best].img || []).push(...imgs);
    load[best] = (load[best] || 0) + imgs.length;
    lastAnchor = best;
  });
}
function toggleSel(src, idx) {

/* ---------- lesson rendering ---------- */
function markTopics(nodes) {
  // source docs: a node is a "talking point" (topic) if the next node sits deeper than it
  for (let i = 0; i < nodes.length; i++) {
    const nxt = nodes[i + 1];
    nodes[i]._k = !!(nxt && nxt.l > Math.max(0, nodes[i].l));
  }
}
/* A long middot-joined run (common-error lists, mostly) is a paragraph, not a
   talking point. Break it into one bullet per item so it is readable on a phone
   and speakable line by line. */
function splitBulletRuns(nodes) {
  const out = [];
  nodes.forEach(n => {
    const parts = n.t.split(' · ').map(s => s.trim()).filter(Boolean);
    if (n.t.length > 200 && parts.length >= 3 && !n.k) {
      parts.forEach((p, i) => out.push(Object.assign({}, n, {
        t: p.charAt(0).toUpperCase() + p.slice(1),
        img: i === 0 ? n.img : undefined,
        b: n.b && i === 0
      })));
    } else {
      out.push(n);
    }
  });
  return out;
}
function markScriptTopics(nodes) {
  // authored scripts: structure is explicit, so topic = a bold level-1 line.
  // (Never infer from children — parallel list items must style identically
  //  whether or not one of them happens to carry an example underneath.)
  nodes.forEach(n => { n._k = n.k != null ? !!n.k : (n.l === 1 && n.b); });
}
const SELF_MARKED = /^(\d+[.)]|[a-z][.)]|[-–—•*])\s/i;   // line supplies its own marker
function nodeCls(n) {
  if (n.l === -1) return ' sect';
  if (n.l === 0 && n.b) return ' hdr0';

  if (n.b) return ' bold';

}
function nodeEl(n, src, idx) {

  if (indent > 0 && !n.b && !SELF_MARKED.test(n.t)) inner += `<span class="bullet">•</span>`;
  inner += linkify(escapeHtml(n.t), n.lk);

function escapeHtml(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

/* ---------- reference links ----------
   Links live on the source nodes (n.lk) and as a per-lesson list. Inside My
   Lesson Plan the source nodes aren't shown, so any reference named in the
   script text ("AC 91-73", "AIM 4-3-19") is matched against the lesson's link
   list and turned into a link automatically. */
function lessonLinks() {
  if (!cur) return [];
  const src = cur.lesson.con || cur.lesson.ext;
  return (src && src.links) || [];
}
function rxEscape(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
function linkify(escaped, pairs) {
  if (!pairs || !pairs.length) return escaped;
  // longest anchors first so "AIM 4-3-19" wins over "AIM"
  const seen = new Set();
  [...pairs].sort((a, b) => b[0].length - a[0].length).forEach(([anchor, url]) => {
    if (anchor.length < 3 || seen.has(anchor.toLowerCase())) return;
    seen.add(anchor.toLowerCase());
    const esc = escapeHtml(anchor);
    // skip if this stretch is already inside a tag we added
    const re = new RegExp('(?![^<]*>)' + rxEscape(esc), 'g');
    let replaced = false;
    escaped = escaped.replace(re, m => {
      if (replaced) return m;      // one link per anchor per line
      replaced = true;
      return `<a class="reflink" href="${url}" target="_blank" rel="noopener">${m}</a>`;
    });
  });
  return escaped;
}

const ROMAN = ['','I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII','XIII','XIV','XV','XVI'];

function renderFront(front, container, expanded) {

      const d = document.createElement('div');

    if (/OBJECTIVE|COMPLETION|NOTE|ATTENTION|HOOK|WHAT|WHY|OVERVIEW/i.test(head) || longest > 150)

  });
  tog.onclick = () => { const show = wrap.style.display === 'none'; wrap.style.display = show ? '' : 'none'; tog.textContent = (show ? '▾' : '▸') + ' Lesson plan header (objectives · completion standards · elements · schedule)'; };
  container.appendChild(tog);

}

/* ---------- my script ---------- */
function isSkeleton(n) { return n.l === -1 || (n.l === 0 && n.b) || !!n.acs; }
function skeletonHasContent(nodes, i, selSet) {
  // any selected node between this header and the next skeleton header of same-or-higher rank?
  const base = nodes[i].l === -1 ? -1 : Math.max(0, nodes[i].l);
  for (let j = i + 1; j < nodes.length; j++) {
    const n = nodes[j];
    const nl = n.l === -1 ? -1 : Math.max(0, n.l);
    if (isSkeleton(n) && nl <= base) break;
    if (selSet.has(j)) return true;
  }
  return false;
}
let pendingNoteFocus = null; // note index to auto-edit after render

function beginEdit(span, commit) {
  span.setAttribute('contenteditable', 'plaintext-only');
  if (!span.isContentEditable) span.setAttribute('contenteditable', 'true');
  span.focus();
  const range = document.createRange(); range.selectNodeContents(span);
  const s = getSelection(); s.removeAllRanges(); s.addRange(range);
  const orig = span.textContent;
  let done = false;
  const finish = cancel => {
    if (done) return; done = true;
    span.removeAttribute('contenteditable');
    commit(cancel ? orig : span.textContent.trim());
  };
  span.onblur = () => finish(false);
  span.onkeydown = e => {
    e.stopPropagation();
    if (e.key === 'Enter') { e.preventDefault(); finish(false); span.blur(); }
    else if (e.key === 'Escape') { e.preventDefault(); finish(true); span.blur(); }
  };
}

function msItem(n, src, i, opts) {

  div.style.marginLeft = (Math.max(0, n.l) * 18) + 'px';

  let inner = (n.l > 0 && !marked ? `<span class="bullet">${n._k || n.b ? '▸' : '•'}</span>` : '') +
              `<span class="ms-text">${linkify(escapeHtml(text), n.lk || lessonLinks())}</span><span class="mctl">` +
              `<span class="mb play" title="Read from here">▸</span>` +

              (opts.removable ? `<span class="mb rm" title="Remove">×</span>` : '') + `</span>`;
  div.innerHTML = inner;
  // a handbook button on every section and topic heading, straight to the page
  // (the intro/conclusion scaffolding is ours, not the handbook's)
  // handbook button on a heading — only where the chapter actually changes, so
  // it reads as "this part is covered over here" instead of 24 identical chips
  if (opts.ref) {

  }

  div.querySelector('.mb.play').onclick = e => { e.stopPropagation(); if (div.dataset.mi != null) startReading('m', +div.dataset.mi); };

  div.querySelector('.mb.nadd').onclick = () => addNote(key, Math.max(0, n.l));
  const rs = div.querySelector('.mb.reset');

    else toggleSel(src, i);

}

/* ---------- FAA handbook deep links ----------
   The task -> book -> chapter -> PDF page map came out of the CFI dashboard;
   a click opens the handbook in the viewer at that exact page. */
function taskCode(title) {
  const m = title.match(/^([IVXLC]+)\.([A-Z])/);
  return m ? m[1] + '.' + m[2] : null;
}
function lessonRefs() {
  if (!cur || !window.CFI_REFS) return [];
  const code = taskCode(cur.lesson.title);
  return (code && CFI_REFS.tasks[code]) || [];
}
/* Resolve ONE heading to the handbook chapter that covers it:
   1. an explicit citation in the heading itself ("…Handbook, Chapter 7", "AFH 5-21")
   2. otherwise the lesson's mapped chapter whose title best matches the heading
   3. otherwise the lesson's primary chapter */
const BOOK_PATTERNS = [
  [/aviation instructor|\bAIH\b/i, 'FAA-H-8083-9'],
  [/airplane flying|\bAFH\b/i,     'FAA-H-8083-3'],
  [/pilot'?s handbook|\bPHAK\b/i,  'FAA-H-8083-25'],
  [/risk management|\bRMH\b/i,     'FAA-H-8083-2'],
  [/weight *(&|and) *balance/i,    'FAA-H-8083-1'],
  [/aviation weather|\bAWH\b/i,    'FAA-H-8083-28'],
];
function chapterPage(bcode, ch) {
  const book = CFI_REFS.books[bcode];
  if (!book) return null;
  const rec = book.chapters.find(c => c.n === ch);
  return rec ? { b: bcode, ch, t: rec.t, p: rec.p } : null;
}
function refForHeading(text, prev) {
  if (!window.CFI_REFS || !cur) return null;
  // 1. explicit citation
  for (const [re, bcode] of BOOK_PATTERNS) {
    if (!re.test(text)) continue;
    let m = text.match(/chapter\s*(\d+)/i) || text.match(/\bch\.?\s*(\d+)/i);
    if (!m) { const abbr = text.match(/\b(?:AFH|PHAK|AIH|RMH|AWH)\s*(\d+)\s*-\s*\d+/i); if (abbr) m = abbr; }
    if (m) { const hit = chapterPage(bcode, +m[1]); if (hit) return hit; }
  }
  // 2/3. fall back to what this task maps to
  const mapped = lessonRefs().filter(r => r.b !== 'AIM');
  if (!mapped.length) return null;
  if (mapped.length === 1) return mapped[0];
  const words = simTokens(text);
  let best = null, score = 0;
  mapped.forEach(r => { const s = dice(words, simTokens(r.t)); if (s > score) { score = s; best = r; } });
  // a weak match is a guess — stay on the chapter we were already in rather
  // than flip-flopping between chapters heading by heading
  if (score < 0.2) return prev || mapped[0];
  return best;
}
const SKIP_REF = /^(introduction|attention|overview|what|why|how:?|conclusion)$/i;
function computeHeadingRefs(nodes) {
  const out = {};
  if (!window.CFI_REFS) return out;
  const exact = (window.CFI_TOPICREFS || {})[cur ? cur.lesson.id : ''] || {};
  let lastKey = null, lastRef = null;
  nodes.forEach((n, i) => {
    const major = n.l === -1 || (n.l === 0 && n.b);
    if (!major || !n.t || SKIP_REF.test(n.t.trim())) return;
    const hit = exact[n.t];
    if (hit) {   // this heading was found in the handbook text — exact page
      const key = 'x' + hit.b + ':' + hit.p;
      if (key !== lastKey) { out[i] = { b: hit.b, p: hit.p, exact: true }; lastKey = key; }
      lastRef = { b: hit.b, ch: 0, t: '', p: hit.p };
      return;
    }
    const r = refForHeading(n.t, lastRef);
    if (!r) return;
    lastRef = r;
    const key = r.b + ':' + r.ch;
    if (key !== lastKey) { out[i] = r; lastKey = key; }
  });
  return out;
}

function myScriptText() {

  const selSet = script ? new Set(nodes.map((_, i) => i).filter(i => !sel.pr.includes(i)))

  let out = `# ${cur.lesson.title}\n\n_${aoeLabel(cur.aoe)} — My Lesson Plan_\n\n`;

  if (refs) out += `**References:** ${refs}\n\n`;

  (front || []).forEach(cell => {
    cell.forEach((ln, i) => {
      if (!ln.t) return;
      const head = i === 0 && (ln.b || /^[A-Z0-9 &'’/-]+$/.test(ln.t));
      out += head ? `\n**${ln.t}**\n` : `- ${ln.t}\n`;

  const notesFor = key => (sel.notes || []).filter(nt => nt.a === key)
    .map(nt => '  '.repeat(Math.max(0, nt.l || 0)) + '- ' + nt.t + '  *(mine)*\n').join('');
  nodes.forEach((n, i) => {
    const picked = selSet.has(i);
    if (script && !picked) return;
    const t = txt(skelSrc, i, n);
    const key = skelSrc + ':' + i;
    if (n.l === -1) { out += `\n## ${t}\n` + notesFor(key); return; }
    if (n.l === 0 && n.b) { out += `\n### ${t}\n` + notesFor(key); return; }
    if (!script && n.acs) { out += '  '.repeat(Math.max(0, n.l)) + '- **' + t + '**\n' + notesFor(key); return; }
    if (!picked) return;
    out += '  '.repeat(Math.max(0, n.l)) + '- ' + (n.b || n._k ? '**' + t + '**' : t) + '\n' + notesFor(key);
  });
  [['x', cur.lesson.ext && cur.lesson.ext.nodes, 'From extra detail'],
   ['c', cur.lesson.con && cur.lesson.con.nodes, 'From lesson plan']].forEach(([src, srcNodes, label]) => {
    if (src === skelSrc) return;
    const arr = src === 'x' ? sel.x : sel.c;
    if (!arr.length || !srcNodes) return;
    out += `\n## ${label}\n`;
    arr.forEach(i => {
      const n = srcNodes[i]; if (!n) return;
      const t = txt(src, i, n);
      out += '  '.repeat(Math.max(0, n.l)) + '- ' + (n.b || n._k ? '**' + t + '**' : t) + '\n' + notesFor(src + ':' + i);
    });
  });
  const endNotes = (sel.notes || []).filter(nt => nt.a === 'end');
  if (endNotes.length) {

    endNotes.forEach(nt => { out += '- ' + nt.t + '\n'; });
  }
  return out;
}

/* ---------- flow (sequence of topics to teach) ---------- */
let flowMasked = false;

function flowSource() {
  const script = lessonScript();
  if (script) return { nodes: script.nodes, src: 'p' };
  if (cur.lesson.con) return { nodes: cur.lesson.con.nodes, src: 'c' };
  if (cur.lesson.ext) return { nodes: cur.lesson.ext.nodes, src: 'x' };
  return null;
}
function flowTopics(nodes, deep) {
  // ordered outline: sections + headers + ACS-coded elements.
  // Long prose lines are explanations, not topic names — skip them unless ACS-tagged.
  const isName = (n) => n.acs || n.t.length <= 80;
  const out = [];
  nodes.forEach((n, i) => {
    if (!n.t) return;
    if (n.l === -1) { out.push({ i, t: n.t, kind: 'sect' }); return; }
    if (n.l === 0 && n.b) { if (isName(n)) out.push({ i, t: n.t, kind: 'topic', acs: n.acs }); return; }
    if (n.acs && n.l <= 1) { out.push({ i, t: n.t, kind: 'sub', acs: n.acs }); return; }
    if (!deep) return;
    if (n.l === 1) out.push({ i, t: n.t, kind: 'd2' });          // sub-topic
    else if (n.l === 2) out.push({ i, t: n.t, kind: 'd3' });     // key point cue
  });
  return out;
}
// Compress a full sentence down to a recall cue: drop list markers, keep the
// part before an em-dash aside / semicolon, and cap the length.
function shortCue(t) {
  let s = t.replace(/^(\d+[.)]|[a-z][.)])\s+/i, '').trim();
  // Drop a trailing aside only when a real phrase survives — otherwise "The
  // match — or mismatch — between…" collapses to a useless "The match".
  for (const sep of [' — ', ' – ', '; ']) {
    const at = s.indexOf(sep);
    if (at >= 25) { s = s.slice(0, at); break; }
  }
  if (s.length > 72) {
    // First sentence only — the period must end a word, so codes like
    // "FI.I.A.R1" and abbreviations don't get mistaken for a sentence end.
    const m = s.match(/^[^.!?]+[.!?](?=\s|$)/);
    if (m && m[0].length >= 30 && m[0].length < s.length) s = m[0];
  }
  s = s.replace(/[\s.,;:—–]+$/, '');
  return s.length > 66 ? s.slice(0, 64).trim() + '…' : s;
}
function flowLabel(t) { return t.length > 92 ? t.slice(0, 90).trim() + '…' : t; }
function jumpToNode(src, i) {
  if (src === 'p') {
    document.querySelector('.tab[data-tab="mine"]').click();
    const el = [...document.querySelectorAll('#mine-body .ms-item')][i];
    if (el) { el.scrollIntoView({ block: 'center', behavior: 'smooth' }); flashEl(el); }
    return;
  }
  if (!splitView && !isMobile()) {
    if (src === 'c') {   // focus mode: the lesson plan lives in the right pane
      document.querySelector('.tab[data-tab="con"]').click();
      const el = document.querySelector(`#con-body .node[data-idx="${i}"]`);
      if (el) { el.scrollIntoView({ block: 'center', behavior: 'smooth' }); flashEl(el); }
      return;
    }
    splitView = true; store.prefs.split = true; save(); applyModes();  // extra detail needs the left pane
  }
  setLeftTab(src === 'x' ? 'ext' : 'lp');
  store.prefs.leftTab = src === 'x' ? 'ext' : 'lp'; save();
  const pane = src === 'x' ? '#ext-body' : '#lp-body';
  const el = document.querySelector(`${pane} .node[data-idx="${i}"]`);
  if (el) { el.scrollIntoView({ block: 'center', behavior: 'smooth' }); flashEl(el); }
}
function flashEl(el) {
  el.classList.add('speaking');
  setTimeout(() => el.classList.remove('speaking'), 1200);
}
function renderFlow() {
  const fb = $('#flow-body'); fb.innerHTML = '';
  if (!cur) return;
  const srcData = flowSource();
  if (!srcData) { fb.innerHTML = '<div class="empty-hint">No lesson content.</div>'; return; }
  fb.appendChild(paneTitleEl());
  const deep = store.prefs.flowDeep !== false;   // detailed outline by default
  const topics = flowTopics(srcData.nodes, deep);
  const dset = drawSet();
  if (!topics.length) { fb.insertAdjacentHTML('beforeend', '<div class="empty-hint">No topic headers found in this lesson.</div>'); return; }

  const tools = document.createElement('div');
  tools.id = 'flow-tools';
  const count = topics.filter(t => t.kind === 'topic' || t.kind === 'sub').length;
  tools.innerHTML = `<button class="tbtn" id="flow-mask">${flowMasked ? '👁 Reveal all' : '🙈 Drill (hide)'}</button>` +
                    `<button class="tbtn" id="flow-deep">${deep ? '▾ Detailed' : '▸ Topics only'}</button>` +
                    `<span class="hint">${count} topics · click any line to jump to it</span>`;
  fb.appendChild(tools);
  tools.querySelector('#flow-mask').onclick = () => { flowMasked = !flowMasked; renderFlow(); };
  tools.querySelector('#flow-deep').onclick = () => { store.prefs.flowDeep = !deep; save(); renderFlow(); };

  let n = 0;
  topics.forEach(t => {
    if (t.kind === 'sect') {
      const s = document.createElement('div');
      s.className = 'flow-sect'; s.textContent = flowLabel(t.t);
      if (dset.has(t.t)) s.insertAdjacentHTML('beforeend', '<span class="draw-chip">✏ DRAW</span>');
      fb.appendChild(s);
      return;
    }
    const d = document.createElement('div');
    const numbered = t.kind === 'topic' || t.kind === 'sub';
    if (numbered) n++;
    d.className = 'flow-item' + (t.kind === 'sub' ? ' sub' : '') +
                  (t.kind === 'd2' ? ' d2' : '') + (t.kind === 'd3' ? ' d3' : '') +
                  (flowMasked ? ' masked' : '');
    d.title = t.t;
    const label = numbered ? flowLabel(t.t) : shortCue(t.t);
    const marker = numbered ? `${n}.` : (t.kind === 'd2' ? '' : '–');
    d.innerHTML = `<span class="flow-num">${marker}</span><span class="flow-text">${escapeHtml(label)}</span>` +
                  (dset.has(t.t) ? '<span class="draw-chip">✏ DRAW</span>' : '') +
                  (t.acs ? `<span class="flow-acs">${t.acs[0]}</span>` : '');
    d.onclick = () => {
      if (d.classList.contains('masked')) { d.classList.remove('masked'); return; } // reveal first
      jumpToNode(srcData.src, t.i);
    };
    fb.appendChild(d);
  });
}

/* ---------- flashcards ----------
   Deck auto-built from the lesson: front = a topic, back = its sub-points.
   Prefers the authored script (best structure); falls back to the teach
   script / extra detail, so every lesson has cards. */
const ACTION_RE = /^(Action:|Counter:|Prevent:|Never |DO NOT|Do not confront|Antidote:)/i;
const SKIP_SECT_RE = /^(introduction|conclusion)/i;   // skip whole intro/outro sections
const SKIP_FRONT_RE = /^(attention$|overview$|what$|why$|conclusion|acronym cheat sheet)/i;

function cardSource() {
  const script = lessonScript();
  if (script) return { nodes: script.nodes, src: 'p' };
  if (cur.lesson.con) { markTopics(cur.lesson.con.nodes); return { nodes: cur.lesson.con.nodes, src: 'c' }; }
  if (cur.lesson.ext) { markTopics(cur.lesson.ext.nodes); return { nodes: cur.lesson.ext.nodes, src: 'x' }; }
  return null;
}
function buildDeck() {
  const sd = cardSource();
  if (!sd) return { cards: [], src: null };
  const nodes = sd.nodes;
  let sect = '';
  const cards = [];
  const isFront = n => (n.l === 0 && n.b) || (n._k && n.l <= 1) || (n.acs && n.l <= 1);
  for (let i = 0; i < nodes.length; i++) {
    const n = nodes[i];
    if (n.l === -1) { sect = n.t; continue; }
    if (!isFront(n) || !n.t) continue;
    if (SKIP_FRONT_RE.test(n.t) || SKIP_SECT_RE.test(sect)) continue;
    const base = Math.max(0, n.l);
    const back = [];
    for (let j = i + 1; j < nodes.length && back.length < 10; j++) {
      const m = nodes[j];
      if (m.l === -1 || Math.max(0, m.l) <= base) break;
      if (!m.t) continue;
      back.push({ t: m.t, sub: Math.max(0, m.l) > base + 1, b: !!m.b, act: ACTION_RE.test(m.t) });
    }
    if (back.length) cards.push({ i, sect, front: n.t, back });
  }
  return { cards, src: sd.src };
}

let deck = [], deckQueue = [], deckIdx = -1, cardFlipped = false, deckShuffled = false;
function cardKnown() {
  const sel = getSel();
  if (!sel.fc) sel.fc = { src: null, known: [] };
  return sel.fc;
}
function startDeck() {
  const built = buildDeck();
  deck = built.cards;
  const fc = cardKnown();
  if (fc.src !== built.src) { fc.src = built.src; fc.known = []; save(); }
  const known = new Set(fc.known);
  deckQueue = deck.filter(c => !known.has(c.i)).map(c => deck.indexOf(c));
  if (deckShuffled) {
    for (let i = deckQueue.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [deckQueue[i], deckQueue[j]] = [deckQueue[j], deckQueue[i]];
    }
  }
  deckIdx = deckQueue.length ? 0 : -1;
  cardFlipped = false;
  renderCards();
}
function currentCard() { return deckIdx >= 0 && deckIdx < deckQueue.length ? deck[deckQueue[deckIdx]] : null; }
function cardAnswer(got) {
  const c = currentCard(); if (!c) return;
  const fc = cardKnown();
  if (got) {
    if (!fc.known.includes(c.i)) fc.known.push(c.i);
    save();
    deckQueue.splice(deckIdx, 1);
  } else {
    const [q] = deckQueue.splice(deckIdx, 1);
    deckQueue.push(q); // recycle to the end
  }
  if (deckIdx >= deckQueue.length) deckIdx = 0;
  if (!deckQueue.length) deckIdx = -1;
  cardFlipped = false;
  renderCards();
  updateCounts();
}
function renderCards() {
  const cb = $('#cards-body'); cb.innerHTML = '';
  if (!cur) return;
  cb.appendChild(paneTitleEl());
  const fc = cardKnown();

  const tools = document.createElement('div');
  tools.id = 'card-tools';
  tools.innerHTML = `<button class="tbtn" id="cards-shuffle">${deckShuffled ? '🔀 Shuffled' : '→ In order'}</button>` +
                    `<button class="tbtn" id="cards-reset">↺ Reset progress</button>` +
                    `<span class="hint">tap card to flip · ✓ = got it</span>`;
  cb.appendChild(tools);
  tools.querySelector('#cards-shuffle').onclick = () => { deckShuffled = !deckShuffled; startDeck(); };
  tools.querySelector('#cards-reset').onclick = () => { fc.known = []; save(); startDeck(); updateCounts(); };

  const stage = document.createElement('div');
  stage.id = 'card-stage';
  const c = currentCard();
  if (!deck.length) {
    stage.innerHTML = '<div class="cards-done"><div class="big">—</div>No card-worthy topics found in this lesson.</div>';
  } else if (!c) {
    stage.innerHTML = `<div class="cards-done"><div class="big">✓</div>All ${deck.length} cards done.<br><br></div>`;
    const b = document.createElement('button');
    b.className = 'tbtn primary'; b.textContent = '↺ Start over';
    b.style.display = 'block'; b.style.margin = '0 auto';
    b.onclick = () => { fc.known = []; save(); startDeck(); updateCounts(); };
    stage.querySelector('.cards-done').appendChild(b);
  } else {
    const card = document.createElement('div');
    card.id = 'fcard';
    if (!cardFlipped) {
      const dr = drawSet().has(c.front) ? '<div style="margin-top:8px"><span class="draw-chip">✏ DRAW THIS ONE</span></div>' : '';
      card.innerHTML = `<div class="fc-kicker">${escapeHtml(c.sect || cur.lesson.title)}</div>` +
                       `<div class="fc-front">${escapeHtml(c.front)}</div>` + dr +
                       `<div class="fc-hint">tap to reveal</div>`;
    } else {
      card.innerHTML = `<div class="fc-kicker">${escapeHtml(c.front)}</div>` +
        `<div class="fc-back">` +
        c.back.map(l => {
          const cls = 'bk' + (l.sub ? ' sub' : '') + (l.act ? ' act' : '');
          const txt = l.b && !l.act ? '<b>' + escapeHtml(l.t) + '</b>' : escapeHtml(l.t);
          return `<div class="${cls}">${l.sub ? '– ' : '• '}${txt}</div>`;
        }).join('') + `</div>`;
    }
    card.onclick = () => { cardFlipped = !cardFlipped; renderCards(); };
    stage.appendChild(card);

    const actions = document.createElement('div');
    actions.id = 'card-actions';
    actions.innerHTML = `<button id="btn-again">✗ Again</button><button id="btn-got">✓ Got it</button>`;
    actions.querySelector('#btn-again').onclick = () => cardAnswer(false);
    actions.querySelector('#btn-got').onclick = () => cardAnswer(true);
    stage.appendChild(actions);

    const prog = document.createElement('div');
    prog.id = 'card-progress';
    prog.innerHTML = `${deckQueue.length} to go · <span class="known">${fc.known.length} known</span> · ${deck.length} total`;
    stage.appendChild(prog);
  }
  cb.appendChild(stage);
}
function cardsVisible() { return $('#cards-body').style.display !== 'none'; }

/* ---------- in-app PDF viewer (pdf.js) ----------
   Renders pages on a canvas so "open at page 38" actually lands on page 38,
   on every platform, with no download prompt. */
let pdfDoc = null, pdfPage = 1, pdfScale = 0, pdfRendering = false, pdfPending = null, pdfUrl = null;
function openDoc(url, title) {
  if (window.pdfjsLib && !/^https?:/.test(url)) openPdfViewer(url, title);
  else window.open(url, '_blank', 'noopener');
}
function openPdfViewer(url, title) {
  stopReading();
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'vendor/pdf.worker.min.js';
  const [file, frag] = url.split('#');
  const want = +(frag || '').replace(/^page=/, '') || 1;
  ['#con-body', '#mine-body', '#flow-body', '#cards-body'].forEach(sel => $(sel).style.display = 'none');
  document.querySelectorAll('.tab[data-tab]').forEach(x => x.classList.remove('active'));
  if (isMobile()) showPane('right');
  const mb = $('#media-body'); mb.style.display = ''; mb.innerHTML = '';
  mb.innerHTML =
    `<div class="mv-head">
       <button class="tbtn" id="mv-back">‹ Back</button>
       <div class="mv-title">${escapeHtml(title || file.split('/').pop())}</div>
       <button class="tbtn" id="pv-toc-btn" style="display:none" title="Contents">☰</button>
       <button class="tbtn" id="pv-prev">‹</button>
       <input id="pv-page" type="number" min="1" value="${want}">
       <span id="pv-total" class="pv-total">/ …</span>
       <button class="tbtn" id="pv-next">›</button>
       <button class="tbtn" id="pv-zoomout">−</button>
       <button class="tbtn" id="pv-zoomin">+</button>
       <a class="reflink" style="margin-left:6px" href="${url}" target="_blank" rel="noopener">↗</a>
     </div>
     <div id="pv-toc"></div>
     <div id="pv-scrub"><input id="pv-slider" type="range" min="1" max="1" value="${want}"></div>
     <div id="pv-stage"><canvas id="pv-canvas"></canvas><div id="pv-msg">loading…</div></div>`;
  $('#mv-back').onclick = () => { mb.style.display = 'none'; pdfDoc = null; document.querySelector('.tab[data-tab="mine"]').click(); };
  $('#pv-prev').onclick = () => pdfGo(pdfPage - 1);
  $('#pv-next').onclick = () => pdfGo(pdfPage + 1);
  $('#pv-page').onchange = e => pdfGo(+e.target.value || 1);
  $('#pv-slider').oninput = e => pdfGo(+e.target.value || 1);
  $('#pv-toc-btn').onclick = () => { const t = $('#pv-toc'); t.style.display = t.style.display === 'block' ? 'none' : 'block'; };
  $('#pv-zoomin').onclick = () => { pdfScale = Math.min((pdfScale || 1) * 1.25, 4); pdfRender(); };
  $('#pv-zoomout').onclick = () => { pdfScale = Math.max((pdfScale || 1) / 1.25, 0.4); pdfRender(); };
  pdfUrl = file; pdfPage = want; pdfScale = 0; pdfDoc = null;
  pdfjsLib.getDocument(file).promise.then(doc => {
    pdfDoc = doc;
    $('#pv-total').textContent = '/ ' + doc.numPages;
    $('#pv-slider').max = doc.numPages;
    pdfPage = Math.min(want, doc.numPages);
    pdfRender();
    doc.getOutline().then(outline => { if (outline && outline.length) buildPdfToc(outline); }).catch(() => {});
  }).catch(err => { $('#pv-msg').textContent = 'could not open — ' + err.message; });
}
/* the PDF's own bookmarks -> tappable contents list (books without bookmarks
   just never show the ☰ button) */
function buildPdfToc(outline) {
  const box = $('#pv-toc');
  if (!box) return;
  box.innerHTML = '';
  const add = (items, depth) => items.forEach(it => {
    const d = document.createElement('div');
    d.className = 'pv-toc-item' + (depth ? ' d' + Math.min(depth, 2) : '');
    d.innerHTML = `<span>${escapeHtml(it.title || '…')}</span><span class="pg"></span>`;
    d.onclick = () => pdfDestPage(it.dest).then(p => {
      if (p) { pdfGo(p); box.style.display = 'none'; }
    });
    box.appendChild(d);
    // show the page number once resolved, without blocking the list
    pdfDestPage(it.dest).then(p => { if (p) d.querySelector('.pg').textContent = 'p.' + p; }).catch(() => {});
    if (it.items && it.items.length && depth < 2) add(it.items, depth + 1);
  });
  add(outline, 0);
  $('#pv-toc-btn').style.display = '';
}
async function pdfDestPage(dest) {
  if (!pdfDoc || !dest) return null;
  let d = dest;
  if (typeof d === 'string') d = await pdfDoc.getDestination(d);
  if (!d || !d[0]) return null;
  return (await pdfDoc.getPageIndex(d[0])) + 1;
}
function pdfGo(p) {
  if (!pdfDoc) return;
  pdfPage = Math.max(1, Math.min(p, pdfDoc.numPages));
  $('#pv-page').value = pdfPage;
  const sl = $('#pv-slider');
  if (sl && +sl.value !== pdfPage) sl.value = pdfPage;
  pdfRender();
}
function pdfRender() {
  if (!pdfDoc) return;
  if (pdfRendering) { pdfPending = pdfPage; return; }
  pdfRendering = true;
  pdfDoc.getPage(pdfPage).then(page => {
    const stage = $('#pv-stage');
    if (!pdfScale) pdfScale = (stage.clientWidth - 8) / page.getViewport({ scale: 1 }).width;
    const vp = page.getViewport({ scale: pdfScale * (window.devicePixelRatio || 1) });
    const canvas = $('#pv-canvas');
    canvas.width = vp.width; canvas.height = vp.height;
    canvas.style.width = (vp.width / (window.devicePixelRatio || 1)) + 'px';
    $('#pv-msg').textContent = '';
    return page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
  }).then(() => {
    pdfRendering = false;
    if (pdfPending !== null && pdfPending !== pdfPage) { pdfPage = pdfPending; pdfPending = null; pdfRender(); }
    else pdfPending = null;
  }).catch(() => { pdfRendering = false; });
}
