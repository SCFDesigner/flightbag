/* ---------- TTS ---------- */
let speaking = false, spkSrc = null, spkIdx = -1, utter = null, spkTok = null;
const synth = window.speechSynthesis;

/* Neural voices via local edge-tts server (same engine as the FOI study tool).
   Tries the Condenser's own server first, then the BookScraper one. */
/* Plain US voices only — the "Multilingual" variants guess the language per
   sentence and wander into other accents mid-lesson. */
const NEURAL_VOICES = [
  ['en-US-AndrewNeural',      'Andrew (Neural)'],
  ['en-US-BrianNeural',       'Brian (Neural)'],
  ['en-US-ChristopherNeural', 'Christopher (Neural)'],
  ['en-US-GuyNeural',         'Guy (Neural)'],
  ['en-US-AriaNeural',        'Aria (Neural)'],
  ['en-US-JennyNeural',       'Jenny (Neural)'],
];
// devices that saved the old multilingual Andrew move to the steady one
if (/Multilingual/.test(store.prefs.voice || '')) {
  store.prefs.voice = 'neural:en-US-AndrewNeural';
  localStorage.setItem(LS_KEY, JSON.stringify(store));
}
const TTS_ENDPOINTS = ['http://localhost:5602/tts', 'http://localhost:8765/tts'];
let ttsEndpoint = null, neuralDeadAt = 0;
const ttsCache = new Map(); // text|voice -> Promise<Blob>
let ttsAudio = null;

function isNeural() { return $('#voice').value.startsWith('neural:'); }
function neuralName() { return $('#voice').value.slice(7); }

async function ttsFetch(text, voice) {
  const key = voice + '|' + text;
  if (ttsCache.has(key)) { const v = ttsCache.get(key); ttsCache.delete(key); ttsCache.set(key, v); return v; }
  const attempt = async () => {
    const eps = ttsEndpoint ? [ttsEndpoint] : TTS_ENDPOINTS;
    let lastErr;
    for (const ep of eps) {
      try {
        const r = await fetch(ep, { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({ text, voice }) });
        if (!r.ok) throw new Error('http ' + r.status);
        ttsEndpoint = ep;
        return await r.blob();
      } catch (e) { lastErr = e; if (ttsEndpoint === ep) ttsEndpoint = null; }
    }
    throw lastErr;
  };
  const p = attempt();
  p.catch(() => ttsCache.delete(key));
  ttsCache.set(key, p);
  while (ttsCache.size > 60) ttsCache.delete(ttsCache.keys().next().value);
  return p;
}
function prefetchAhead() {
  if (!isNeural() || !cur) return;
  const nodes = spokenNodes(spkSrc);
  const v = neuralName();
  for (let i = spkIdx + 1, got = 0; i < nodes.length && got < 3; i++) {
    if (nodes[i].t) { ttsFetch(nodes[i].t, v).catch(() => {}); got++; }
  }
}

function voiceRank(v) {
  // Microsoft neural voices sound best, then other "natural"/online voices, then Apple premiums
  if (/microsoft.*(natural|online)/i.test(v.name)) return 0;
  if (/microsoft/i.test(v.name)) return 1;
  if (/natural|neural|online|premium|enhanced/i.test(v.name)) return 2;
  if (/samantha|ava|allison|zoe|google/i.test(v.name)) return 3;
  return 4;
}
const NOVELTY = /albert|bad news|bahh|bells|boing|bubbles|cellos|deranged|good news|jester|organ|superstar|trinoids|whisper|wobble|zarvox|junior|ralph|kathy|fred/i;
function voices() {
  const en = synth.getVoices().filter(v => v.lang.startsWith('en') && !NOVELTY.test(v.name));
  const us = en.filter(v => /en[-_]US/i.test(v.lang));
  return (us.length ? us : en).sort((a, b) => voiceRank(a) - voiceRank(b) || a.name.localeCompare(b.name));
}
function voiceLabel(v) {
  let label = v.name.replace(/^Microsoft\s*/, 'MS ');
  const natural = /\(natural/i.test(label);
  label = label.split('(')[0].replace(/\s+Online\s*$/i, '').trim();
  return natural ? label + ' (Natural)' : label;
}
// The neural voices come from a local edge-tts server. When the page is served
// from anywhere else (GitHub Pages on a phone), that server is unreachable — so
// don't offer them at all instead of failing over on every line.
const NEURAL_OK = location.protocol === 'file:' ||
                  ['localhost', '127.0.0.1', '0.0.0.0'].includes(location.hostname) ||
                  /^(10\.|192\.168\.|172\.(1[6-9]|2\d|3[01])\.)/.test(location.hostname);
function populateVoices() {
  const sel = $('#voice'); const vs = voices();
  sel.innerHTML = '';
  if (NEURAL_OK) NEURAL_VOICES.forEach(([id, label]) => {
    const o = document.createElement('option');
    o.value = 'neural:' + id; o.textContent = label;
    sel.appendChild(o);
  });
  vs.forEach(v => {
    const o = document.createElement('option');
    o.value = v.name; o.textContent = voiceLabel(v);
    sel.appendChild(o);
  });
  const saved = store.prefs.voice;
  if (saved && [...sel.options].some(o => o.value === saved)) sel.value = saved;
  else if (NEURAL_OK) sel.value = 'neural:' + NEURAL_VOICES[0][0]; // Andrew — same as FOI tool
  else if (vs.length) sel.value = vs[0].name;                      // best device voice
}
synth.onvoiceschanged = populateVoices;
populateVoices();
$('#voice').onchange = e => { store.prefs.voice = e.target.value; save(); if (speaking) { const s = spkSrc, i = spkIdx; stopReading(); startReading(s, i); } };

let msPlaylist = [];   // rendered My Script lines, in display order
function spokenNodes(src) {
  if (src === 'm') return msPlaylist;
  const nodes = src === 'x' ? (cur.lesson.ext && cur.lesson.ext.nodes) : (cur.lesson.con && cur.lesson.con.nodes);
  return nodes || [];
}
function startReading(src, idx) {
  if (!cur) return;
  stopReading();
  spkSrc = src; spkIdx = idx;
  speaking = true;
  $('#btn-play').textContent = '⏸ Pause';
  $('#btn-play').classList.add('playing');
  speakCurrent();
}
function speakCurrent() {
  const nodes = spokenNodes(spkSrc);
  while (spkIdx < nodes.length && !nodes[spkIdx].t) spkIdx++;
  if (spkIdx >= nodes.length) { stopReading(); return; }
  highlight(spkSrc, spkIdx);
  const n = nodes[spkIdx];
  const tok = {}; spkTok = tok;
  const advance = () => { if (!speaking || spkTok !== tok) return; spkIdx++; speakCurrent(); };

  const neuralOk = isNeural() && (performance.now() - neuralDeadAt > 15000 || neuralDeadAt === 0);
  if (neuralOk) {
    ttsFetch(n.t, neuralName()).then(blob => {
      if (!speaking || spkTok !== tok) return;
      neuralDeadAt = 0;
      if (!ttsAudio) ttsAudio = new Audio();
      const a = ttsAudio;
      a.src = URL.createObjectURL(blob);
      a.playbackRate = parseFloat($('#rate').value);
      a.onended = advance;
      a.onerror = advance;
      a.play().catch(() => speakLocal(n, tok, advance));
      prefetchAhead();
    }).catch(() => {
      if (!speaking || spkTok !== tok) return;
      neuralDeadAt = performance.now(); // server down — back off, use local voice
      speakLocal(n, tok, advance);
    });
  } else {
    speakLocal(n, tok, advance);
  }
}
function speakLocal(n, tok, advance) {
  utter = new SpeechSynthesisUtterance(n.t);
  utter.rate = parseFloat($('#rate').value);
  const v = voices().find(v => v.name === $('#voice').value);
  if (v) utter.voice = v;
  utter.onend = advance;
  synth.speak(utter);
}
function highlight(src, idx) {
  document.querySelectorAll('.node.speaking, .ms-item.speaking').forEach(e => e.classList.remove('speaking'));
  const sel = src === 'm' ? `.ms-item[data-mi="${idx}"]` : `.node[data-src="${src}"][data-idx="${idx}"]`;
  document.querySelectorAll(sel).forEach(el => {
    el.classList.add('speaking');
    if (el.offsetParent) el.scrollIntoView({ block: 'center', behavior: 'smooth' });
  });
}
function stopReading() {
  speaking = false;
  spkTok = null;
  synth.cancel();
  if (ttsAudio) { try { ttsAudio.pause(); } catch (e) {} ttsAudio.onended = null; }
  document.querySelectorAll('.node.speaking').forEach(e => e.classList.remove('speaking'));
  $('#btn-play').textContent = '▶ Read';
  $('#btn-play').classList.remove('playing');
}
function togglePlay() {
  if (!cur) return;
  if (speaking) {
    if (ttsAudio && ttsAudio.src && !ttsAudio.ended && isNeural()) {
      if (ttsAudio.paused) { ttsAudio.play(); $('#btn-play').textContent = '⏸ Pause'; }
      else { ttsAudio.pause(); $('#btn-play').textContent = '▶ Resume'; }
    }
    else if (synth.paused) { synth.resume(); $('#btn-play').textContent = '⏸ Pause'; }
    else if (synth.speaking) { synth.pause(); $('#btn-play').textContent = '▶ Resume'; }
  } else {
    let src;
    if ($('#mine-body').style.display !== 'none') src = 'm';        // My Script tab showing
    else if (!splitView && !isMobile()) src = 'c';                  // focus mode = right pane only
    else {
      const onLp = document.querySelector('.tab[data-ltab="lp"]').classList.contains('active');
      src = (onLp && cur.lesson.con) || !cur.lesson.ext ? 'c' : 'x';
    }
    startReading(src, spkSrc === src && spkIdx >= 0 ? spkIdx : 0);
  }
}
function skip(dir) {
  if (!speaking) return;
  const nodes = spokenNodes(spkSrc);
  let i = spkIdx + dir;
  while (i >= 0 && i < nodes.length && !nodes[i].t) i += dir;
  if (i < 0 || i >= nodes.length) return;
  spkIdx = i;
  spkTok = null;
  synth.cancel();
  if (synth.paused) synth.resume();
  if (ttsAudio) { try { ttsAudio.pause(); } catch (e) {} ttsAudio.onended = null; }
  $('#btn-play').textContent = '⏸ Pause';
  setTimeout(() => { if (speaking) speakCurrent(); }, 60);
}
$('#btn-play').onclick = togglePlay;
$('#btn-stop').onclick = stopReading;
$('#rate').oninput = e => {
  const r = parseFloat(e.target.value);
  $('#rate-val').textContent = r.toFixed(1) + 'x';
  store.prefs.rate = r; save();
  if (ttsAudio && !ttsAudio.paused) ttsAudio.playbackRate = r; // neural: live, no restart
  else if (speaking && synth.speaking) { synth.cancel(); setTimeout(() => { if (speaking) speakCurrent(); }, 60); }
};
$('#fsize').oninput = e => { document.documentElement.style.setProperty('--fs', e.target.value + 'px'); store.prefs.fs = +e.target.value; save(); };

/* keyboard */
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.isContentEditable) return;
  if (cardsVisible() && currentCard()) {   // cards take over the keys while showing
    if (e.code === 'Space') { e.preventDefault(); cardFlipped = !cardFlipped; renderCards(); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); cardAnswer(true); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); cardAnswer(false); }
    return;
  }
  if (!readMode) return;   // teach mode: no accidental read-aloud from keys
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  else if (e.key === 'Escape') stopReading();
  else if (e.key === 'ArrowRight') { e.preventDefault(); skip(1); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); skip(-1); }
  else if ((e.key === 'a' || e.key === 'A' || e.key === 'Enter') && speaking && spkIdx >= 0 && spkSrc !== 'm') {
    e.preventDefault();
    toggleSel(spkSrc, spkIdx);
    const sel = getSel();
    const on = (spkSrc === 'x' ? sel.x : sel.c).includes(spkIdx);
    toast(on ? '✓ Added to My Lesson Plan' : 'Removed from My Lesson Plan');
  }
});

/* ---------- quick-action dock: prev/next lesson + thumb-reach menu ---------- */

function flatLessons() {

function dockNeighbors() {

$('#dock-next').onclick = () => { const { next } = dockNeighbors(); if (next) { tocOpen = false; loadLesson(next.aoe, next.lesson); showDock(); } };

/* ---------- password gate ----------
   Note: this gates the interface, not the files. A static site can always be
   fetched directly (data.js, assets/…), so this deters casual browsing only.
   The <meta robots noindex> tag is what keeps the page out of search results. */
window.CFI_PW_HASH = 'bb6aaa1408ba3d7cbc2c3365af590db79904ea29004f7117ebfed98dec4b6651';
window.CFI_PW_PLAIN = 'Collin123';   // fallback for file:// where crypto.subtle is unavailable
async function sha256(s) {
  if (!(crypto && crypto.subtle)) return 'plain:' + s;
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
}
async function tryUnlock(pw) {
  const h = await sha256(pw);
  return h === window.CFI_PW_HASH || h === 'plain:' + window.CFI_PW_PLAIN;
}
function unlockUI() {
  $('#gate').classList.add('hidden');
  setTimeout(() => { if (isMobile()) showPane('left'); }, 0);
}
(function initGate() {
  if (localStorage.getItem('cfi-unlocked') === '1') { unlockUI(); return; }
  const go = async () => {
    const ok = await tryUnlock($('#gate-pw').value);
    if (ok) { localStorage.setItem('cfi-unlocked', '1'); unlockUI(); }
    else { $('#gate-err').classList.add('show'); $('#gate-pw').select(); }
  };
  $('#gate-go').onclick = go;
  $('#gate-pw').addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Enter') go(); });
  setTimeout(() => $('#gate-pw').focus(), 100);
})();

/* ---------- offline (checkride-day insurance) ---------- */
const SW_CACHE = 'cfi-binder-v8';   // keep in step with sw.js
function libraryUrls() {
  return (window.CFI_DOCS || []).map(d => d.url);
}
function everyAssetUrl() {
  const urls = new Set(['./', './index.html', './custom.js', './data.js', './refs.js', './docs.js', './topicrefs.js', './schoolrefs.js', './draw.js', './figs.js', './manifest.webmanifest', 'vendor/pdf.min.js', 'vendor/pdf.worker.min.js']);
  const lib = new Set(libraryUrls());
  DOCS.forEach(d => { if (!lib.has(d.url)) urls.add(d.url); });   // handbooks download separately
  CFI_DATA.aoes.forEach(a => a.lessons.forEach(l => {
    ['con', 'ext'].forEach(v => {
      const src = l[v]; if (!src) return;
      (src.front || []).forEach(cell => cell.forEach(ln => { if (ln.img) urls.add(ln.img); }));
      (src.nodes || []).forEach(n => (n.img || []).forEach(p => urls.add(p)));
    });
  }));
  return [...urls];
}
function setOfflineState(txt, cls) {
  const el = $('#offline-state');
  if (el) { el.textContent = txt; el.className = cls || ''; }
}
async function offlineReport() {
  if (!('caches' in window)) return setOfflineState('offline not supported in this browser');
  const all = everyAssetUrl();
  const c = await caches.open(SW_CACHE);
  let have = 0;
  for (const u of all) if (await c.match(u, { ignoreSearch: true })) have++;
  if (have >= all.length) setOfflineState(`✓ all ${all.length} files saved — works with no signal`, 'ready');
  else setOfflineState(`${have} of ${all.length} files saved for offline`);
}
if ('serviceWorker' in navigator) {
  // When a newer worker takes over, reload once so the page it serves is the
  // new one — otherwise a fix can sit on the server and never reach the device.
  let reloadedForUpdate = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (reloadedForUpdate) return;
    reloadedForUpdate = true;
    location.reload();
  });
  navigator.serviceWorker.register('sw.js').then(reg => {
    reg.update();
    offlineReport(); libReport();
  }).catch(() => setOfflineState('offline unavailable'));
  navigator.serviceWorker.addEventListener('message', e => {
    const d = e.data || {};
    if (d.type !== 'CACHE_PROGRESS') return;
    if (d.done < d.total) setOfflineState(`saving ${d.done} / ${d.total}…`, 'working');
    else offlineReport();
  });
} else setOfflineState('offline unavailable (open over https)');

$('#btn-offline').onclick = async () => {
  if (!navigator.serviceWorker || !navigator.serviceWorker.controller) {
    setOfflineState('reload once, then try again'); return;
  }
  setOfflineState('saving…', 'working');
  navigator.serviceWorker.controller.postMessage({ type: 'CACHE_ALL', urls: everyAssetUrl() });
};

async function libReport() {
  const el = $('#offline-lib-state'); if (!el || !('caches' in window)) return;
  const lib = libraryUrls(); if (!lib.length) return;
  const c = await caches.open(SW_CACHE);
  let have = 0;
  for (const u of lib) if (await c.match(u, { ignoreSearch: true })) have++;
  el.textContent = have >= lib.length ? `✓ all ${lib.length} documents saved` : `${have} of ${lib.length} documents saved`;
  el.className = have >= lib.length ? 'ready' : '';
}
/* settings can fold away — it is reference furniture, not something you use
   while teaching */
(function initSettingsToggle() {
  const box = $('#nav-settings'), tog = $('#ns-toggle');
  if (!box || !tog) return;

  apply();
})();

/* Nuclear option: throw away the worker and every cached file, then reload
   fresh from the server. Use it if the binder ever looks out of date. */
$('#btn-update').onclick = async () => {
  setOfflineState('updating…', 'working');
  try {
    if (navigator.serviceWorker) {
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r => r.unregister()));
    }
    if ('caches' in window) {
      const keys = await caches.keys();
      await Promise.all(keys.map(k => caches.delete(k)));
    }
  } catch (e) { /* fall through to the reload regardless */ }
  location.replace(location.pathname + '?u=' + Date.now());
};

$('#btn-offline-lib').onclick = () => {
  if (!navigator.serviceWorker || !navigator.serviceWorker.controller) return;
  const el = $('#offline-lib-state');
  el.textContent = 'downloading documents — leave this open…'; el.className = 'working';
  navigator.serviceWorker.controller.postMessage({ type: 'CACHE_ALL', urls: libraryUrls() });
  setTimeout(libReport, 8000);
};

/* ---------- cross-device sync (same Firebase as the W&B calculator) ----------
   Your picks, edits, notes and card progress merge across devices, newest
   lesson wins. Prefs (font size, toggles, voice) stay per-device. */
const SYNC_PATH = 'cfiBinder/state';
let syncDb = null, syncPushTimer = null, applyingRemote = false;
const clientId = (() => {
  let id = localStorage.getItem('cfi-client-id');
  if (!id) { id = Math.random().toString(36).slice(2, 10); localStorage.setItem('cfi-client-id', id); }
  return id;
})();
function setSyncState(txt, cls) {
  const el = $('#sync-state');
  if (el) { el.textContent = 'sync: ' + txt; el.className = cls || ''; }
}
function syncPayload() {
  // JSON round-trip drops `undefined` values — Firebase set() rejects a payload
  // containing any (and empty-object lessons pruned by Firebase can reappear
  // locally as undefined via mergeRemote on other devices)
  return JSON.parse(JSON.stringify({ sel: store.sel, selTs: store.selTs || {}, last: store.last,
           clientId, updatedAt: Date.now() }));
}
function schedulePush() {
  if (!syncDb || applyingRemote) return;
  clearTimeout(syncPushTimer);
  syncPushTimer = setTimeout(() => {
    syncDb.ref(SYNC_PATH).set(syncPayload())
      .then(() => setSyncState('✓ saved to cloud', 'ok'))
      .catch(() => setSyncState('offline — will sync when online', 'err'));
  }, 1200);
}
function mergeRemote(remote) {
  if (!remote || !remote.sel) return false;
  const rTs = remote.selTs || {}, lTs = store.selTs || {};
  let changed = false;
  const keys = new Set([...Object.keys(remote.sel), ...Object.keys(store.sel)]);
  keys.forEach(k => {
    if ((rTs[k] || 0) > (lTs[k] || 0)) {
      // Firebase strips empty objects/arrays, so a lesson with no picks comes
      // back as undefined — restore an empty shell instead of storing undefined
      store.sel[k] = remote.sel[k] || { x: [], c: [] };
      (store.selTs = store.selTs || {})[k] = rTs[k];
      changed = true;
    }
  });
  return changed;
}
function initSync() {
  if (typeof firebase === 'undefined') { setSyncState('offline — using this device only', 'err'); return; }
  try {
    firebase.initializeApp({
      apiKey: "AIzaSyCJNQslFf0_mGwRHFyx1aqtnfdgAk2tfao",
      authDomain: "weight-and-balance-d5044.firebaseapp.com",
      databaseURL: "https://weight-and-balance-d5044-default-rtdb.firebaseio.com",
      projectId: "weight-and-balance-d5044"
    });
    syncDb = firebase.database();
    syncDb.ref(SYNC_PATH).on('value', snap => {
      const remote = snap.val();
      if (!remote) { setSyncState('✓ connected', 'ok'); schedulePush(); return; }
      if (remote.clientId === clientId) { setSyncState('✓ synced', 'ok'); return; }
      applyingRemote = true;
      const changed = mergeRemote(remote);
      applyingRemote = false;
      if (changed) {
        localStorage.setItem(LS_KEY, JSON.stringify(store));
        if (cur) { renderMine(); updateCounts(); }
        setSyncState('✓ pulled changes from your other device', 'ok');
      } else setSyncState('✓ synced', 'ok');
    }, () => setSyncState('offline — using this device only', 'err'));
  } catch (e) { setSyncState('unavailable', 'err'); }
}
initSync();

/* ---------- init ---------- */

}
if (!cur) loadLesson(D.aoes[0], D.aoes[0].lessons[0]);
